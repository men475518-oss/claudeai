<head>
<meta charset="utf-8">
<title>AFTERGROVE — 片手で遊ぶ小さな冒険</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#0a0910;
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #stage { position:fixed; inset:0; display:grid; place-items:center; background:#0a0910; }
  #screen {
    display:block; image-rendering:pixelated; image-rendering:crisp-edges;
    touch-action:none; background:#12101c;
  }
  #boot {
    position:fixed; inset:0; display:grid; place-items:center; gap:12px;
    background:#0a0910; color:#d8cfa8; font-size:13px; letter-spacing:.14em; z-index:10;
    transition:opacity .35s ease;
  }
  #boot.gone { opacity:0; pointer-events:none; }
  #boot b { display:block; font-size:19px; letter-spacing:.3em; color:#e8c46a; margin-bottom:6px; }
  #boot small { display:block; opacity:.5; letter-spacing:.1em; margin-top:10px; font-size:11px; }
  noscript { color:#d8cfa8; }
</style>
</head>

<div id="stage"><canvas id="screen"></canvas></div>

// ---------------------------------------------------------------------------
// util.js — 数学・乱数・ノイズなどの小さな道具箱
// ---------------------------------------------------------------------------

const TAU = Math.PI * 2;

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => (b === a ? 0 : (v - a) / (b - a));
const sign = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);

/** 値を目標へ一定速度で近づける（フレーム時間つき） */
function approach(v, target, step) {
  if (v < target) return Math.min(v + step, target);
  if (v > target) return Math.max(v - step, target);
  return target;
}

const dist2 = (ax, ay, bx, by) => {
  const dx = bx - ax, dy = by - ay;
  return dx * dx + dy * dy;
};
const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));

/** -PI..PI に正規化 */
function wrapAngle(a) {
  while (a > Math.PI) a -= TAU;
  while (a < -Math.PI) a += TAU;
  return a;
}

/** 矩形同士の重なり判定（中心座標＋半幅） */
function overlaps(ax, ay, ahw, ahh, bx, by, bhw, bhh) {
  return Math.abs(ax - bx) < ahw + bhw && Math.abs(ay - by) < ahh + bhh;
}

/** イージング */
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInCubic = (t) => t * t * t;
const easeOutBack = (t) => {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
};
const easeInOutQuad = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

// --- 決定論的乱数 (mulberry32) -------------------------------------------

function makeRng(seed) {
  let a = (seed >>> 0) || 1;
  const rng = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.int = (n) => Math.floor(rng() * n);
  rng.range = (lo, hi) => lo + rng() * (hi - lo);
  rng.irange = (lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));
  rng.pick = (arr) => arr[Math.floor(rng() * arr.length)];
  rng.chance = (p) => rng() < p;
  rng.shuffle = (arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };
  rng.angle = () => rng() * TAU;
  return rng;
}

/** 文字列 → 32bit シード */
function hashSeed(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

/** 座標ハッシュ：同じ (x,y,seed) は常に同じ 0..1 を返す */
function hash2(x, y, seed = 0) {
  let h = (Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(seed | 0, 0x9e3779b1)) >>> 0;
  h = Math.imul(h ^ (h >>> 15), h | 1) >>> 0;
  h ^= h + Math.imul(h ^ (h >>> 7), h | 61);
  return ((h ^ (h >>> 14)) >>> 0) / 4294967296;
}

// --- 値ノイズ（バイオーム生成用） ----------------------------------------

const smooth = (t) => t * t * (3 - 2 * t);

/** 2D 値ノイズ。周波数 f、シード seed。戻り値 0..1 */
function valueNoise(x, y, seed = 0) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = smooth(xf), v = smooth(yf);
  const a = hash2(xi, yi, seed);
  const b = hash2(xi + 1, yi, seed);
  const c = hash2(xi, yi + 1, seed);
  const d = hash2(xi + 1, yi + 1, seed);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}

/** オクターブ重ね掛け（fBm）。戻り値 0..1 */
function fbm(x, y, seed = 0, octaves = 4, lacunarity = 2, gain = 0.5) {
  let amp = 1, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += amp * valueNoise(x * freq, y * freq, seed + i * 1013);
    norm += amp;
    amp *= gain;
    freq *= lacunarity;
  }
  return sum / norm;
}

/** リッジノイズ（山脈・崖の生成に） */
function ridge(x, y, seed = 0, octaves = 3) {
  let amp = 1, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < octaves; i++) {
    const n = 1 - Math.abs(valueNoise(x * freq, y * freq, seed + i * 733) * 2 - 1);
    sum += amp * n * n;
    norm += amp;
    amp *= 0.5;
    freq *= 2;
  }
  return sum / norm;
}

// --- 汎用 ------------------------------------------------------------------

/** 配列から条件に合う最初の要素を取り除く */
function removeItem(arr, item) {
  const i = arr.indexOf(item);
  if (i >= 0) arr.splice(i, 1);
  return i >= 0;
}

/** 数値を 0 埋め */
const pad = (n, w = 2) => String(n).padStart(w, '0');

/** 秒 → mm:ss */
function formatTime(sec) {
  const s = Math.max(0, Math.floor(sec));
  return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
}

/** 4方向を角度から求める (0:下 1:左 2:右 3:上) */
function dirFromVec(dx, dy) {
  if (Math.abs(dx) > Math.abs(dy)) return dx < 0 ? 1 : 2;
  return dy < 0 ? 3 : 0;
}

  [-1, 0],  // 1 左
  [1, 0],   // 2 右
  [0, -1],  // 3 上
];

  [O.CRACK]:     { spr: null, solid: 1, hp: 0, tall: 0 },
  [O.TORCH]:     { spr: null, solid: 1, hp: 0, tall: 1 },
  [O.POT]:       { spr: null, solid: 0, hp: 1, tall: 0 },
};

function objSolid(id) { const d = OBJ_DEF[id]; return d ? d.solid : 0; }

// --- レベル ----------------------------------------------------------------

class Level {
  constructor(w, h, kind = 'field') {
    this.w = w; this.h = h;
    this.kind = kind;                     // 'field' | 'dungeon' | 'town'
    this.ground = new Uint8Array(w * h);
    this.obj = new Uint8Array(w * h);
    this.objHp = new Map();               // index -> 残り HP
    this.explored = new Uint8Array(w * h);
    this.buildings = [];
    this.spawns = [];                     // 敵のリスポーン定義
    this.dark = kind === 'dungeon';       // 視界制限
    this.music = kind === 'dungeon' ? 'dungeon' : 'field';
    this.name = '';
    this.id = 'field';
  }
  idx(x, y) { return y * this.w + x; }
  inb(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  g(x, y) { return this.inb(x, y) ? this.ground[y * this.w + x] : T.CLIFF; }
  o(x, y) { return this.inb(x, y) ? this.obj[y * this.w + x] : O.NONE; }
  setG(x, y, v) { if (this.inb(x, y)) this.ground[y * this.w + x] = v; }
  setO(x, y, v) {
    if (!this.inb(x, y)) return;
    const i = y * this.w + x;
    this.obj[i] = v;
    const def = OBJ_DEF[v];
    if (def && def.hp > 0) this.objHp.set(i, def.hp); else this.objHp.delete(i);
  }
  solid(x, y) {
    if (!this.inb(x, y)) return true;
    const i = y * this.w + x;
    return !!TERRAIN_SOLID[this.ground[i]] || !!objSolid(this.obj[i]);
  }
  /** 水だけを判定（落水演出用） */
  isWater(x, y) { const g = this.g(x, y); return g === T.WATER || g === T.DEEP; }
  slow(x, y) { return !!TERRAIN_SLOW[this.g(x, y)]; }

  /** ピクセル座標での矩形衝突 */
  hits(px, py, hw, hh) {
    const x0 = Math.floor((px - hw) / TILE), x1 = Math.floor((px + hw - 0.001) / TILE);
    const y0 = Math.floor((py - hh) / TILE), y1 = Math.floor((py + hh - 0.001) / TILE);
    for (let y = y0; y <= y1; y++)
      for (let x = x0; x <= x1; x++)
        if (this.solid(x, y)) return true;
    return false;
  }
  markExplored(cx, cy, r) {
    const x0 = Math.max(0, cx - r), x1 = Math.min(this.w - 1, cx + r);
    const y0 = Math.max(0, cy - r), y1 = Math.min(this.h - 1, cy + r);
    for (let y = y0; y <= y1; y++)
      for (let x = x0; x <= x1; x++)
        if ((x - cx) ** 2 + (y - cy) ** 2 <= r * r) this.explored[y * this.w + x] = 1;
  }
}

// --- 建物 ------------------------------------------------------------------

const BUILDINGS = [
  { id: 'home',    name: 'あなたの家',   cost: 0,    desc: 'ねむって体力を回復できる。' },
  { id: 'shop',    name: 'よろず屋',     cost: 60,   desc: 'ポーションや爆弾を買える。' },
  { id: 'smith',   name: 'かじ屋',       cost: 120,  desc: '剣をきたえて攻撃力を上げる。' },
  { id: 'healer',  name: 'いやしの家',   cost: 200,  desc: 'ハートの最大値を増やせる。' },
  { id: 'sage',    name: '賢者の塔',     cost: 320,  desc: '魔法をさずかる。' },
  { id: 'farm',    name: '畑',           cost: 90,   desc: '毎日きのみが実る。' },
  { id: 'well',    name: '井戸',         cost: 40,   desc: '村のうるおい。訪れる人が増える。' },
];

// --- オーバーワールド生成 --------------------------------------------------

function biomeAt(x, y, seed, sea) {
  const nx = x / 42, ny = y / 42;
  const e = fbm(nx, ny, seed, 5);
  const m = fbm(nx + 100, ny + 100, seed + 555, 4);
  const r = ridge(nx * 1.4, ny * 1.4, seed + 999, 3);
  return { e, m, r };
}

/** 幅優先で到達可能タイルを塗る */
function floodReach(level, sx, sy) {
  const { w, h } = level;
  const seen = new Uint8Array(w * h);
  const q = new Int32Array(w * h);
  let qs = 0, qe = 0;
  q[qe++] = sy * w + sx; seen[sy * w + sx] = 1;
  let count = 1;
  while (qs < qe) {
    const i = q[qs++];
    const x = i % w, y = (i / w) | 0;
    for (let d = 0; d < 4; d++) {
      const nx = x + (d === 0 ? 1 : d === 1 ? -1 : 0);
      const ny = y + (d === 2 ? 1 : d === 3 ? -1 : 0);
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const j = ny * w + nx;
      if (seen[j]) continue;
      if (TERRAIN_SOLID[level.ground[j]]) continue;
      seen[j] = 1; q[qe++] = j; count++;
    }
  }
  return { seen, count };
}

/** 円形に地形をならす */
function carveCircle(level, cx, cy, r, terrain) {
  for (let y = cy - r; y <= cy + r; y++)
    for (let x = cx - r; x <= cx + r; x++) {
      if (!level.inb(x, y)) continue;
      const d = Math.hypot(x - cx, y - cy);
      if (d <= r) { level.setG(x, y, terrain); level.setO(x, y, O.NONE); }
    }
}

/** 2 点を結ぶ道。確率的に斜めへ進むので、直角に折れずに自然な小径になる。 */
function carvePath(level, ax, ay, bx, by, rng, width = 0) {
  let x = ax, y = ay, guard = 0;
  const paint = (cx, cy) => {
    for (let oy = -width; oy <= width; oy++)
      for (let ox = -width; ox <= width; ox++) {
        const px = cx + ox, py = cy + oy;
        if (!level.inb(px, py)) continue;
        if (Math.abs(ox) + Math.abs(oy) > width) continue;
        const t = level.g(px, py);
        if (t === T.DEEP) continue;                 // 深い水は埋めない
        level.setG(px, py, T.DIRT);
        const ob = level.o(px, py);
        if (ob && OBJ_DEF[ob] && OBJ_DEF[ob].solid) level.setO(px, py, O.NONE);
      }
  };
  while ((x !== bx || y !== by) && guard++ < 8000) {
    paint(x, y);
    const dx = bx - x, dy = by - y;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (adx === 0) y += Math.sign(dy);
    else if (ady === 0) x += Math.sign(dx);
    else if (rng() < adx / (adx + ady)) x += Math.sign(dx);
    else y += Math.sign(dy);
    // ときどき ふらつく
    if (rng() < 0.10) {
      if (rng() < 0.5) x += rng() < 0.5 ? 1 : -1;
      else y += rng() < 0.5 ? 1 : -1;
    }
    x = clamp(x, 1, level.w - 2); y = clamp(y, 1, level.h - 2);
  }
  paint(bx, by);
}

function generateOverworld(seed) {

  for (let attempt = 0; attempt < 10; attempt++) {

    level.id = 'field';
    level.name = 'アフターグローヴ';
    const s = seed + attempt * 7919;

    for (let y = 0; y < WORLD_H; y++) {

      const dc = Math.hypot(x - WORLD_W / 2, y - WORLD_H / 2);
      if (dc > 46) continue;
      let ok = 0;
      for (let oy = -5; oy <= 5; oy++)
        for (let ox = -5; ox <= 5; ox++)

      const score = ok - dc * 0.4;
      if (!best || score > best.score) best = { x, y, score };

    townY = best ? best.y : (WORLD_H >> 1);

  const reachable = (x, y) => level.inb(x, y) && reach.seen[y * level.w + x] === 1;

  // --- 植生・岩を配置 ---
  for (let y = 1; y < WORLD_H - 1; y++) {
    for (let x = 1; x < WORLD_W - 1; x++) {
      const t = level.g(x, y);
      if (TERRAIN_SOLID[t]) continue;
      const h = hash2(x, y, seed + 31);
      const inTown = Math.hypot(x - townX, y - townY) < 10;
      if (inTown) {
        if (h < 0.05) level.setO(x, y, O.FLOWER);
        else if (h < 0.12) level.setO(x, y, O.TUFT);
        continue;
      }
      if (t === T.FOREST) {
        // 大きなうねりで「林」と「ひらけた場所」を作る
        const density = 0.18 + fbm(x / 11, y / 11, seed + 4242, 2) * 0.34;
        if (h < density) level.setO(x, y, hash2(x, y, seed + 8) < 0.28 ? O.PINE : O.TREE);
        else if (h < density + 0.10) level.setO(x, y, O.BUSH);
        else if (h < density + 0.17) level.setO(x, y, O.TUFT);
      } else if (t === T.GRASS) {
        if (h < 0.055) level.setO(x, y, O.TREE);
        else if (h < 0.10) level.setO(x, y, O.BUSH);
        else if (h < 0.13) level.setO(x, y, O.FLOWER);
        else if (h < 0.20) level.setO(x, y, O.TUFT);
      } else if (t === T.MARSH) {
        if (h < 0.10) level.setO(x, y, O.DEADTREE);
        else if (h < 0.22) level.setO(x, y, O.BUSH);
        else if (h < 0.30) level.setO(x, y, O.TUFT);
      } else if (t === T.SAND) {
        if (h < 0.03) level.setO(x, y, O.ROCK);
        else if (h < 0.05) level.setO(x, y, O.TUFT);
      } else if (t === T.STONE) {
        if (h < 0.12) level.setO(x, y, O.ROCK);
      } else if (t === T.ASH) {
        if (h < 0.13) level.setO(x, y, O.DEADTREE);
        else if (h < 0.18) level.setO(x, y, O.ROCK);
        else if (h < 0.21) level.setO(x, y, O.GRAVE);
      }
    }
  }

  // --- 村の整地 ---
  carveCircle(level, townX, townY, 8, T.GRASS);
  for (let y = townY - 8; y <= townY + 8; y++)
    for (let x = townX - 8; x <= townX + 8; x++) {
      if (!level.inb(x, y)) continue;
      const h = hash2(x, y, seed + 77);
      if (h < 0.05) level.setO(x, y, O.FLOWER);
      else if (h < 0.11) level.setO(x, y, O.TUFT);
    }

  // --- ダンジョン入口を 3 つ ---
  const dungeons = [];
  const wantBiomes = [
    { t: T.FOREST, name: 'ねむりの森', theme: 'forest', level: 1 },
    { t: T.STONE,  name: 'こだまの洞', theme: 'cave',   level: 2 },
    { t: T.ASH,    name: '灰の神殿',   theme: 'ruin',   level: 3 },
  ];
  for (let i = 0; i < wantBiomes.length; i++) {
    const want = wantBiomes[i];
    let spot = null, bestScore = -1;
    for (let k = 0; k < 6000; k++) {
      const x = rng.irange(6, WORLD_W - 7), y = rng.irange(6, WORLD_H - 7);
      if (!reachable(x, y)) continue;
      const d = Math.hypot(x - townX, y - townY);
      if (d < 22 + i * 12 || d > 90) continue;
      let match = level.g(x, y) === want.t ? 8 : 0;
      for (let oy = -3; oy <= 3; oy++) for (let ox = -3; ox <= 3; ox++)
        if (level.g(x + ox, y + oy) === want.t) match++;
      const far = dungeons.every(dg => Math.hypot(dg.x - x, dg.y - y) > 34);
      if (!far) continue;
      const score = match + d * 0.05;
      if (score > bestScore) { bestScore = score; spot = { x, y }; }
    }
    if (!spot) {
      // 見つからなければ到達可能な適当な遠い場所
      for (let k = 0; k < 8000 && !spot; k++) {
        const x = rng.irange(6, WORLD_W - 7), y = rng.irange(6, WORLD_H - 7);
        if (reachable(x, y) && Math.hypot(x - townX, y - townY) > 24) spot = { x, y };
      }
    }
    if (!spot) continue;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      level.setO(spot.x + ox, spot.y + oy, O.NONE);
      if (TERRAIN_SOLID[level.g(spot.x + ox, spot.y + oy)]) level.setG(spot.x + ox, spot.y + oy, T.DIRT);
    }
    level.setG(spot.x, spot.y, T.STONE);
    level.setO(spot.x, spot.y, O.CAVE);
    dungeons.push({ id: 'dg' + i, x: spot.x, y: spot.y, ...want, cleared: false, seed: seed + 4177 * (i + 1) });
    carvePath(level, townX, townY, spot.x, spot.y + 1, rng, 0);
  }

  // --- とらわれた村人（檻）---
  const villagers = [];
  for (let i = 0; i < 7; i++) {
    let spot = null;
    for (let k = 0; k < 4000 && !spot; k++) {
      const x = rng.irange(5, WORLD_W - 6), y = rng.irange(5, WORLD_H - 6);
      if (!reachable(x, y)) continue;
      const d = Math.hypot(x - townX, y - townY);
      if (d < 14 || d > 85) continue;
      if (villagers.some(v => Math.hypot(v.x - x, v.y - y) < 20)) continue;
      let open = 0;
      for (let oy = -2; oy <= 2; oy++) for (let ox = -2; ox <= 2; ox++)
        if (!level.solid(x + ox, y + oy)) open++;
      if (open < 18) continue;
      spot = { x, y };
    }
    if (!spot) continue;
    for (let oy = -2; oy <= 2; oy++) for (let ox = -2; ox <= 2; ox++) {
      if (TERRAIN_SOLID[level.g(spot.x + ox, spot.y + oy)]) level.setG(spot.x + ox, spot.y + oy, T.DIRT);
      const ob = level.o(spot.x + ox, spot.y + oy);
      if (ob && OBJ_DEF[ob] && OBJ_DEF[ob].solid) level.setO(spot.x + ox, spot.y + oy, O.NONE);
    }
    level.setO(spot.x, spot.y, O.CAGE);
    villagers.push({ id: 'vil' + i, x: spot.x, y: spot.y, kind: i % 8, freed: false, building: BUILDINGS[(i % (BUILDINGS.length - 1)) + 1].id });
  }

  // --- 宝箱 ---
  const chests = [];
  for (let i = 0; i < 22; i++) {
    for (let k = 0; k < 2500; k++) {
      const x = rng.irange(4, WORLD_W - 5), y = rng.irange(4, WORLD_H - 5);
      if (!reachable(x, y) || level.solid(x, y)) continue;
      if (Math.hypot(x - townX, y - townY) < 12) continue;
      if (chests.some(c => Math.hypot(c.x - x, c.y - y) < 12)) continue;
      level.setO(x, y, O.CHEST);
      chests.push({ x, y, loot: rng() < 0.22 ? 'heart' : rng() < 0.5 ? 'coins' : rng() < 0.7 ? 'bomb' : 'potion' });
      break;
    }
  }

  // --- 立て札 ---
  const signs = [];
  const signTexts = [
    'ここは アフターグローヴ。\nむかしは にぎやかな村だった。',
    'まもの に つかまった 仲間を\nさがしている…',
    'ほら穴 には たからと きけんが\nねむっている。',
    'くさ を きると なにか 出るかも。',
    'つよい敵には ためうち（Ａ長押し）を。',
  ];
  for (let i = 0; i < signTexts.length; i++) {
    for (let k = 0; k < 800; k++) {
      const ang = rng() * Math.PI * 2, r = 11 + i * 5 + rng() * 8;
      const x = Math.round(townX + Math.cos(ang) * r), y = Math.round(townY + Math.sin(ang) * r);
      if (!reachable(x, y) || level.solid(x, y)) continue;
      level.setO(x, y, O.SIGN);
      signs.push({ x, y, text: signTexts[i] });
      break;
    }
  }

  // --- 最終の門（3 つの遺物で開く）---
  let gate = null;
  for (let k = 0; k < 8000 && !gate; k++) {
    const x = rng.irange(5, WORLD_W - 6), y = rng.irange(5, WORLD_H - 6);
    if (!reachable(x, y)) continue;
    const d = Math.hypot(x - townX, y - townY);
    if (d < 40) continue;
    gate = { x, y };
  }
  if (gate) {
    for (let oy = -2; oy <= 2; oy++) for (let ox = -3; ox <= 3; ox++) {
      if (!level.inb(gate.x + ox, gate.y + oy)) continue;
      level.setG(gate.x + ox, gate.y + oy, T.STONE);
      level.setO(gate.x + ox, gate.y + oy, O.NONE);
    }
    level.setO(gate.x, gate.y, O.GATE);
    carvePath(level, townX, townY, gate.x, gate.y + 2, rng, 0);
  }

  return { level, townX, townY, dungeons, villagers, chests, signs, gate, reach };
}

/** 村の広場に建物区画を作る */
function layoutTown(level, townX, townY) {
  const plots = [
    { dx: -6, dy: -4, w: 4, h: 3 },
    { dx: 1,  dy: -5, w: 4, h: 3 },
    { dx: 5,  dy: 0,  w: 4, h: 3 },
    { dx: -7, dy: 2,  w: 4, h: 3 },
    { dx: 0,  dy: 4,  w: 4, h: 3 },
    { dx: -3, dy: -7, w: 4, h: 3 },
    { dx: 6,  dy: -6, w: 3, h: 3 },
  ];
  const list = [];
  for (let i = 0; i < BUILDINGS.length; i++) {
    const p = plots[i % plots.length];
    const b = {
      ...BUILDINGS[i],
      x: townX + p.dx, y: townY + p.dy, w: p.w, h: p.h,
      built: BUILDINGS[i].id === 'home',
    };
    list.push(b);
  }
  applyBuildings(level, list);
  return list;
}

/** 建物の当たり判定をタイルへ反映 */
function applyBuildings(level, list) {
  for (const b of list) {
    for (let y = b.y; y < b.y + b.h; y++)
      for (let x = b.x; x < b.x + b.w; x++) {
        if (!level.inb(x, y)) continue;
        level.setO(x, y, O.NONE);
        level.setG(x, y, b.built ? T.DIRT : T.GRASS);
      }
    if (b.built) {
      // 建物本体は下 1 行を除いて壁（下辺が入口側）
      for (let y = b.y; y < b.y + b.h - 1; y++)
        for (let x = b.x; x < b.x + b.w; x++)
          if (level.inb(x, y)) level.setO(x, y, O.PILLAR);
      // 入口タイル（下辺は入口の 1 マスだけ通れる）
      const dx = b.x + (b.w >> 1);
      const dy = b.y + b.h - 1;
      b.doorX = dx; b.doorY = dy;
      for (let x = b.x; x < b.x + b.w; x++)
        if (level.inb(x, dy)) level.setO(x, dy, x === dx ? O.NONE : O.PILLAR);
      level.setG(dx, dy, T.DIRT);
    }
  }
}

    if (this.shadow <= 0) return;
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = '#000000';
    const w = this.shadow, h = Math.max(2, (w * 0.45) | 0);
    ctx.beginPath();
    ctx.ellipse(Math.round(this.x), Math.round(this.y), w, h, 0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  blit(ctx, spr, ox = 0, oy = 0, scale = 1, flashWhite = false) {
    const w = spr.width * scale, h = spr.height * scale;
    const dx = Math.round(this.x - w / 2 + ox);
    const dy = Math.round(this.y - h + oy - this.z);
    ctx.drawImage(flashWhite ? whiteOf(spr) : spr, dx, dy, w, h);
  }
}

// ---------------------------------------------------------------------------
// プレイヤー
// ---------------------------------------------------------------------------
class Player extends Entity {
  constructor(x, y) {
    super(x, y);
    this.hw = PLAYER.hitW / 2; this.hh = PLAYER.hitH / 2;
    this.maxHp = 6; this.hp = 6;
    this.shadow = 5;
    this.speed = PLAYER.speed;
    this.invuln = 0;
    this.attack = 0;          // 残り時間
    this.attackDir = 0;
    this.attackHit = new Set();
    this.cooldown = 0;
    this.charge = 0;
    this.spin = 0;
    this.combo = 0;
    this.comboT = 0;
    this.walkT = 0;
    this.stepT = 0;
    this.swordLv = 0;
    this.coins = 0;
    this.keys = 0;
    this.gems = 0;
    this.bombs = 1;
    this.potions = 1;
    this.magic = 0;           // 0=なし 1=魔法弾
    this.mp = 0; this.maxMp = 0;
    this.item = 'bomb';       // B ボタンで使うもの
    this.relics = 0;
    this.deadT = 0;
    this.spawnGuard = 0.4;
  }

  get dmg() { return 2 + this.swordLv; }

  hurt(g, amount, fromX, fromY) {
    if (this.invuln > 0 || this.spawnGuard > 0 || this.hp <= 0) return false;
    this.hp = Math.max(0, this.hp - amount);
    this.invuln = PLAYER.invuln;
    this.hurtT = 0.3;
    const a = Math.atan2(this.y - fromY, this.x - fromX);
    this.kbx = Math.cos(a) * 150; this.kby = Math.sin(a) * 150;
    this.attack = 0; this.spin = 0; this.charge = 0;
    FX.shake(3.2, 0.25); FX.hitstop(0.07);
    FX.burst(this.x, this.y - 8, 8, [PAL.o, PAL.n, PAL.p]);
    FX.floatText(this.x, this.y - 14, '-' + amount, PAL.o, { size: 7 });
    sfx('hurt');
    if (this.hp <= 0) { sfx('die'); FX.flash('#000000', 0.5); }
    return true;
  }

  heal(n) {
    const before = this.hp;
    this.hp = Math.min(this.maxHp, this.hp + n);
    if (this.hp > before) FX.floatText(this.x, this.y - 14, '+' + ((this.hp - before) / 2), PAL.o, { size: 7 });
  }

  startAttack(spin = false) {
    if (spin) {
      this.spin = PLAYER.spinTime;
      this.attack = 0;
      this.attackHit.clear();
      sfx('swingBig');
      FX.ring(this.x, this.y - 6, { r0: 4, r1: 26, life: 0.32, color: PAL.l });
      return;
    }
    this.attack = PLAYER.attackTime;
    this.attackDir = this.dir;
    this.attackHit.clear();
    this.combo = (this.comboT > 0 ? this.combo + 1 : 0) % 2;
    this.comboT = 0.55;
    this.cooldown = PLAYER.attackCooldown;
    sfx('swing');
  }

  /** 攻撃の当たり判定（矩形） */
  hitbox() {
    if (this.spin > 0) return { x: this.x, y: this.y - 4, hw: 17, hh: 14, spin: true };
    if (this.attack <= 0) return null;
    const t = 1 - this.attack / PLAYER.attackTime;
    if (t < 0.12 || t > 0.78) return null;
    const [dx, dy] = DIR_VEC[this.attackDir];
    const reach = 11;
    return {
      x: this.x + dx * reach, y: this.y - 4 + dy * reach,
      hw: dx !== 0 ? 10 : 11, hh: dy !== 0 ? 10 : 9,
    };
  }

  update(dt, g) {
    const inp = g.input;
    if (this.hp <= 0) { this.deadT += dt; this.applyKnockback(dt, g); return; }

    this.invuln = Math.max(0, this.invuln - dt);
    this.hurtT = Math.max(0, this.hurtT - dt);
    this.cooldown = Math.max(0, this.cooldown - dt);
    this.comboT = Math.max(0, this.comboT - dt);
    this.spawnGuard = Math.max(0, this.spawnGuard - dt);

    // 攻撃・ため・道具の入力は main.js の simulate() が一括で扱う

    if (this.attack > 0) this.attack = Math.max(0, this.attack - dt);
    if (this.spin > 0) this.spin = Math.max(0, this.spin - dt);

    // --- 移動 ---
    let mx = 0, my = 0;
    if (g.canAct) { mx = inp.mx; my = inp.my; }
    const attacking = this.attack > 0 || this.spin > 0;
    let sp = this.speed * (attacking ? 0.42 : 1);
    if (g.level.slow(this.tx, this.ty)) sp *= 0.62;
    if (this.charge > 0.14) sp *= 0.55;

    const len = Math.hypot(mx, my);
    if (len > 0.02) {
      if (!attacking) this.dir = dirFromVec(mx, my);
      this.walkT += dt * (4 + len * 6);
      this.stepT += dt * len;
      if (this.stepT > 0.34) { this.stepT = 0; sfx('step'); FX.dust(this.x, this.y + 1, 1); }
    } else {
      this.walkT = 0;
    }
    this.moveBy(g, mx * sp * dt, my * sp * dt);
    this.applyKnockback(dt, g);
  }

  draw(ctx) {
    this.drawShadow(ctx);
    const frames = SPR.hero[this.dir];
    const f = this.walkT > 0 ? (Math.floor(this.walkT) % 2) : 0;
    const bob = this.walkT > 0 && f === 1 ? -1 : 0;
    const flashing = this.invuln > 0 && Math.floor(this.invuln * 18) % 2 === 0;
    if (flashing && this.hurtT > 0.05) {
      this.blit(ctx, frames[f], 0, bob, 1, true);
    } else if (this.invuln > 0 && Math.floor(this.invuln * 22) % 2 === 0) {
      ctx.globalAlpha = 0.4; this.blit(ctx, frames[f], 0, bob); ctx.globalAlpha = 1;
    } else {
      this.blit(ctx, frames[f], 0, bob);
    }
    // 溜めのきらめき
    if (this.charge > PLAYER.chargeTime) {
      const t = performance.now() / 100;
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = Math.floor(t) % 2 ? PAL.t : PAL.l;
      for (let i = 0; i < 3; i++) {
        const a = t * 0.9 + i * TAU / 3;
        ctx.fillRect(Math.round(this.x + Math.cos(a) * 11) - 1, Math.round(this.y - 8 + Math.sin(a) * 8) - 1, 2, 2);
      }
      ctx.globalAlpha = 1;
    } else if (this.charge > 0.18) {
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = PAL.x;
      ctx.fillRect(Math.round(this.x - 1), Math.round(this.y - 20), 2, 2);
      ctx.globalAlpha = 1;
    }
    drawSword(ctx, this);
  }
}

/** 剣の軌跡 */
function drawSword(ctx, p) {
  if (p.spin > 0) {
    const t = 1 - p.spin / PLAYER.spinTime;
    const a0 = t * TAU * 2.2;
    ctx.save();
    ctx.translate(Math.round(p.x), Math.round(p.y - 6));
    for (let k = 0; k < 3; k++) {
      const a = a0 - k * 0.34;
      ctx.globalAlpha = 0.9 - k * 0.28;
      ctx.strokeStyle = k === 0 ? PAL.y : PAL.k;
      ctx.lineWidth = 2 - k * 0.5;
      ctx.beginPath();
      ctx.arc(0, 0, 13, a, a + 0.9);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    return;
  }
  if (p.attack <= 0) return;
  const t = 1 - p.attack / PLAYER.attackTime;
  const base = [Math.PI / 2, Math.PI, 0, -Math.PI / 2][p.attackDir];
  const swing = p.combo === 0 ? 1 : -1;
  const a = base + swing * lerp(-1.25, 1.25, t);
  const r = 12 + Math.sin(t * Math.PI) * 3;
  ctx.save();
  ctx.translate(Math.round(p.x), Math.round(p.y - 6));
  ctx.globalAlpha = Math.sin(t * Math.PI) * 0.95;
  ctx.strokeStyle = PAL.y;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, r, a - swing * 0.55, a + swing * 0.15, swing < 0);
  ctx.stroke();
  ctx.strokeStyle = PAL.k;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(0, 0, r - 3, a - swing * 0.7, a, swing < 0);
  ctx.stroke();
  // 刃
  ctx.globalAlpha = 1;
  ctx.strokeStyle = PAL.x;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(Math.cos(a) * 4, Math.sin(a) * 4);
  ctx.lineTo(Math.cos(a) * (r + 1), Math.sin(a) * (r + 1));
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------------------
// 敵
// ---------------------------------------------------------------------------
const ENEMY_DEF = {
  slime:    { hp: 4,  speed: 26, dmg: 1, spr: 'slime',    ai: 'hop',    coin: [2, 4],  hw: 6, hh: 4, shadow: 6, name: 'スライム' },
  bat:      { hp: 3,  speed: 52, dmg: 1, spr: 'bat',      ai: 'flyer',  coin: [2, 4],  hw: 5, hh: 4, shadow: 4, fly: 1, name: 'コウモリ' },
  skeleton: { hp: 7,  speed: 32, dmg: 2, spr: 'skeleton', ai: 'chaser', coin: [4, 8],  hw: 5, hh: 4, shadow: 5, name: 'がいこつ' },
  spore:    { hp: 6,  speed: 0,  dmg: 1, spr: 'spore',    ai: 'turret', coin: [3, 6],  hw: 6, hh: 4, shadow: 6, name: 'キノコ' },
  wolf:     { hp: 6,  speed: 42, dmg: 2, spr: 'wolf',     ai: 'dasher', coin: [4, 8],  hw: 7, hh: 4, shadow: 7, name: 'やまいぬ' },
  warden:   { hp: 46, speed: 26, dmg: 2, spr: 'warden',   ai: 'aiBoss',   coin: [60, 90], hw: 12, hh: 8, shadow: 13, scale: 2, boss: 1, name: '根の番人' },
};

class Enemy extends Entity {
  constructor(x, y, kind, level = 1) {
    super(x, y);
    const d = ENEMY_DEF[kind] || ENEMY_DEF.slime;
    this.kind = kind; this.def = d;
    this.level = level;
    this.maxHp = Math.round(d.hp * (1 + 0.35 * (level - 1)));
    this.hp = this.maxHp;
    this.dmg = d.dmg + (level > 2 ? 1 : 0);
    this.speed = d.speed;
    this.hw = d.hw; this.hh = d.hh;
    this.shadow = d.shadow;
    this.scale = d.scale || 1;
    this.fly = !!d.fly;
    this.boss = !!d.boss;
    this.state = 'idle';
    this.t = rng() * 3;
    this.cd = rng.range(0.4, 1.6);
    this.phase = 0;
    this.wobble = rng() * TAU;
    this.home = { x, y };
    this.aggro = false;
    this.flash = 0;
    this.stun = 0;
    if (this.fly) this.z = 8;
  }

  hurt(g, amount, fromX, fromY, kb = 130) {
    if (this.hp <= 0) return;
    this.hp -= amount;
    this.flash = 0.14;
    this.aggro = true;
    this.stun = this.boss ? 0.06 : 0.16;
    const a = Math.atan2(this.y - fromY, this.x - fromX);
    const k = this.boss ? kb * 0.25 : kb;
    this.kbx = Math.cos(a) * k; this.kby = Math.sin(a) * k;
    FX.burst(this.x, this.y - 6, this.boss ? 10 : 6, [PAL.y, PAL.s, PAL.o], { spMax: 90 });
    FX.floatText(this.x + rng.range(-3, 3), this.y - 12 - this.z, String(amount), PAL.t, { size: 7 });
    sfx(this.boss ? 'hitHard' : 'hit');
    FX.hitstop(this.boss ? 0.05 : 0.035);
    FX.shake(this.boss ? 2.2 : 1.4, 0.14);
    if (this.hp <= 0) this.die(g);
  }

  die(g) {
    this.dead = true;
    FX.burst(this.x, this.y - 6, this.boss ? 34 : 12, [PAL.y, PAL.x, PAL.o, PAL.s], { spMax: this.boss ? 150 : 90, life: 0.7 });
    FX.ring(this.x, this.y - 5, { r0: 3, r1: this.boss ? 44 : 20, life: 0.36, color: PAL.t });
    FX.shake(this.boss ? 7 : 2, this.boss ? 0.5 : 0.16);
    sfx(this.boss ? 'bomb' : 'die');
    const n = rng.irange(this.def.coin[0], this.def.coin[1]);
    const drops = Math.min(n, 8);
    const per = Math.ceil(n / drops);
    for (let i = 0; i < drops; i++) g.spawnPickup(this.x, this.y, 'coin', per);
    if (rng() < (this.boss ? 1 : 0.16)) g.spawnPickup(this.x, this.y, 'heart');
    if (this.boss) {
      for (let i = 0; i < 3; i++) g.spawnPickup(this.x, this.y, 'heart');
      g.onBossDefeated?.(this);
    } else if (rng() < 0.05) g.spawnPickup(this.x, this.y, 'gem');
  }

  update(dt, g) {
    if (this.hp <= 0) return;
    this.t += dt;
    this.flash = Math.max(0, this.flash - dt);
    this.stun = Math.max(0, this.stun - dt);
    this.cd -= dt;
    const p = g.player;
    const d = dist(this.x, this.y, p.x, p.y);
    if (!this.aggro && d < (this.boss ? 200 : 92)) this.aggro = true;
    if (this.aggro && d > 260 && !this.boss) this.aggro = false;

    if (this.stun <= 0 && p.hp > 0) this[this.def.ai](dt, g, p, d);
    this.applyKnockback(dt, g, this.fly);

    // 接触ダメージ
    if (p.hp > 0 && Math.abs(this.x - p.x) < this.hw + p.hw + 2 &&
        Math.abs(this.y - p.y) < this.hh + p.hh + 4 && Math.abs(this.z - p.z) < 14) {
      p.hurt(g, this.dmg, this.x, this.y);
    }
  }

  // --- AI ---
  hop(dt, g, p, d) {
    if (this.z > 0 || this.vz > 0) {
      this.z += this.vz * dt; this.vz -= 260 * dt;
      this.moveBy(g, this.vx * dt, this.vy * dt);
      if (this.z <= 0) { this.z = 0; this.vz = 0; this.vx = this.vy = 0; FX.dust(this.x, this.y, 3); }
      return;
    }
    if (this.cd <= 0) {
      this.cd = rng.range(0.7, 1.3);
      const a = this.aggro ? Math.atan2(p.y - this.y, p.x - this.x) + rng.range(-0.3, 0.3) : rng.angle();
      const sp = this.speed * (this.aggro ? 1.5 : 0.7);
      this.vx = Math.cos(a) * sp; this.vy = Math.sin(a) * sp;
      this.vz = 62;
      this.dir = dirFromVec(this.vx, this.vy);
    }
  }

  flyer(dt, g, p, d) {
    this.wobble += dt * 6;
    this.z = 8 + Math.sin(this.wobble) * 3;
    let ax, ay;
    if (this.aggro) {
      ax = p.x - this.x; ay = p.y - this.y;
    } else {
      ax = this.home.x - this.x + Math.cos(this.t * 1.3) * 40;
      ay = this.home.y - this.y + Math.sin(this.t * 1.7) * 40;
    }
    const l = Math.hypot(ax, ay) || 1;
    const sp = this.speed * (this.aggro ? 1 : 0.55);
    this.vx = lerp(this.vx, (ax / l) * sp + Math.cos(this.wobble * 1.7) * 20, 0.06);
    this.vy = lerp(this.vy, (ay / l) * sp + Math.sin(this.wobble * 2.1) * 14, 0.06);
    this.moveBy(g, this.vx * dt, this.vy * dt, true);
    this.dir = dirFromVec(this.vx, this.vy);
  }

  chaser(dt, g, p, d) {
    if (!this.aggro) {
      if (this.cd <= 0) {
        this.cd = rng.range(1.0, 2.4);
        const a = rng.angle();
        this.vx = Math.cos(a) * this.speed * 0.4; this.vy = Math.sin(a) * this.speed * 0.4;
      }
      this.moveBy(g, this.vx * dt, this.vy * dt);
      return;
    }
    const a = Math.atan2(p.y - this.y, p.x - this.x);
    // 少し左右に振れて群れが重ならないように
    const off = Math.sin(this.t * 2 + this.wobble) * 0.35;
    this.vx = Math.cos(a + off) * this.speed;
    this.vy = Math.sin(a + off) * this.speed;
    this.dir = dirFromVec(this.vx, this.vy);
    this.moveBy(g, this.vx * dt, this.vy * dt);
  }

  turret(dt, g, p, d) {
    this.dir = dirFromVec(p.x - this.x, p.y - this.y);
    if (this.aggro && d < 110 && this.cd <= 0) {
      this.cd = rng.range(1.5, 2.4);
      const a = Math.atan2(p.y - this.y - 4, p.x - this.x);
      for (let i = -1; i <= 1; i++) {
        g.spawnProjectile(this.x, this.y - 8, a + i * 0.24, 62, this.dmg, 'spore');
      }
      sfx('shoot');
    }
  }

  dasher(dt, g, p, d) {
    if (this.state === 'dash') {
      this.moveBy(g, this.vx * dt, this.vy * dt);
      this.cd -= dt * 0;
      if (this.t > this.stateEnd) { this.state = 'idle'; this.cd = rng.range(0.8, 1.6); }
      if (rng() < 0.4) FX.dust(this.x, this.y, 1);
      return;
    }
    if (this.state === 'wind') {
      if (this.t > this.stateEnd) {
        this.state = 'dash'; this.stateEnd = this.t + 0.42;
        const a = Math.atan2(p.y - this.y, p.x - this.x);
        this.vx = Math.cos(a) * this.speed * 3.1;
        this.vy = Math.sin(a) * this.speed * 3.1;
        this.dir = dirFromVec(this.vx, this.vy);
        sfx('dash');
      }
      return;
    }
    if (this.aggro && d < 110 && this.cd <= 0) {
      this.state = 'wind'; this.stateEnd = this.t + 0.42;
      this.dir = dirFromVec(p.x - this.x, p.y - this.y);
      return;
    }
    if (this.cd <= 0) {
      this.cd = rng.range(0.9, 1.8);
      const a = this.aggro ? Math.atan2(p.y - this.y, p.x - this.x) + rng.range(-0.9, 0.9) : rng.angle();
      this.vx = Math.cos(a) * this.speed * 0.5; this.vy = Math.sin(a) * this.speed * 0.5;
      this.dir = dirFromVec(this.vx, this.vy);
    }
    this.moveBy(g, this.vx * dt, this.vy * dt);
  }

  aiBoss(dt, g, p, d) {
    const hpr = this.hp / this.maxHp;
    if (this.state === 'idle') {
      const a = Math.atan2(p.y - this.y, p.x - this.x);
      this.vx = lerp(this.vx, Math.cos(a) * this.speed, 0.04);
      this.vy = lerp(this.vy, Math.sin(a) * this.speed, 0.04);
      this.dir = dirFromVec(this.vx, this.vy);
      this.moveBy(g, this.vx * dt, this.vy * dt);
      if (this.cd <= 0) {
        const roll = rng();
        if (roll < 0.4) { this.state = 'wind'; this.stateEnd = this.t + 0.6; }
        else if (roll < 0.75) { this.state = 'summon'; this.stateEnd = this.t + 0.7; }
        else { this.state = 'spray'; this.stateEnd = this.t + 0.9; this.sprayN = 0; }
        this.cd = 9;
      }
    } else if (this.state === 'wind') {
      FX.dust(this.x + rng.range(-8, 8), this.y, 1);
      if (this.t > this.stateEnd) {
        this.state = 'charge'; this.stateEnd = this.t + 0.9;
        const a = Math.atan2(p.y - this.y, p.x - this.x);
        this.vx = Math.cos(a) * this.speed * 4.2;
        this.vy = Math.sin(a) * this.speed * 4.2;
        sfx('dash');
      }
    } else if (this.state === 'charge') {
      this.moveBy(g, this.vx * dt, this.vy * dt);
      FX.dust(this.x, this.y, 2);
      if (this.t > this.stateEnd) { this.state = 'idle'; this.cd = rng.range(1.2, 2.2) * (hpr < 0.5 ? 0.6 : 1); }
    } else if (this.state === 'summon') {
      if (this.t > this.stateEnd) {
        const n = hpr < 0.5 ? 3 : 2;
        for (let i = 0; i < n; i++) {
          const a = rng.angle();
          g.spawnEnemy(this.x + Math.cos(a) * 26, this.y + Math.sin(a) * 26, rng() < 0.5 ? 'bat' : 'slime', this.level);
        }
        sfx('spawn');
        FX.ring(this.x, this.y - 8, { r0: 4, r1: 40, life: 0.4, color: PAL.A });
        this.state = 'idle'; this.cd = rng.range(1.6, 2.6);
      }
    } else if (this.state === 'spray') {
      if (this.cd2 == null || this.t > this.cd2) {
        this.cd2 = this.t + 0.16;
        const base = this.t * 3.4;
        for (let i = 0; i < 4; i++) {
          g.spawnProjectile(this.x, this.y - 10, base + i * TAU / 4, 58, this.dmg, 'spore');
        }
        sfx('shoot');
        this.sprayN++;
      }
      if (this.t > this.stateEnd) { this.state = 'idle'; this.cd = rng.range(1.4, 2.4); this.cd2 = null; }
    }
  }

  draw(ctx) {
    this.drawShadow(ctx);
    let spr;
    const frames = (this.kind === 'wolf' && (this.dir === 1)) ? SPR.wolfL : SPR[this.def.spr];
    const f = Math.floor(this.t * (this.state === 'dash' || this.state === 'charge' ? 12 : 5)) % frames.length;
    spr = frames[f];
    const tel = (this.state === 'wind');
    if (tel && Math.floor(this.t * 20) % 2 === 0) {
      this.blit(ctx, spr, 0, 0, this.scale, true);
    } else {
      this.blit(ctx, spr, 0, 0, this.scale, this.flash > 0);
    }
    if (this.boss) drawBossBarWorld(ctx, this);
  }
}

function drawBossBarWorld(ctx, e) {
  const w = 30, x = Math.round(e.x - w / 2), y = Math.round(e.y - 40);

    this.kind = kind;
    this.friendly = friendly;

    this.hw = 2; this.hh = 2;
    this.shadow = 0;
    this.t = 0;

  }
  update(dt, g) {
    this.t += dt;
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (g.level.hits(this.x, this.y, 1, 1)) { this.burst(); return; }
    if (this.friendly) {

        if (Math.abs(e.x - this.x) < e.hw + 4 && Math.abs(e.y - 4 - this.y) < e.hh + 8) {

  }

      const a = Math.atan2(p.y - 5 - this.y, p.x - this.x);
      const sp = 40 + this.pull * 190;
      this.x += Math.cos(a) * sp * dt;
      this.y += Math.sin(a) * sp * dt;
    }
    if (d < 9 && p.hp > 0) { g.collect(this); this.dead = true; }
  }

    this.drawShadow(ctx);
    const spr = SPR[PICKUP_SPR[this.kind]] || SPR.coin;
    const bob = Math.sin(this.t * 4) * 1.2;

  }
}

// --- HUD -------------------------------------------------------------------

function ensureHearts() {
  if (heartEmpty) return;
  heartEmpty = silhouette(SPR.heart, '#42303a');
  heartHalf = makeCanvas(8, 8);
  const c = heartHalf.getContext('2d');
  c.drawImage(heartEmpty, 0, 0);
  c.save(); c.beginPath(); c.rect(0, 0, 4, 8); c.clip();
  c.drawImage(SPR.heart, 0, 0); c.restore();
}

function drawHud(ctx, g) {
  ensureHearts();
  const S = ui.S, W = view.cssW;
  const p = g.player;
  const top = ui.padTop;

  // ハート
  const hs = 2.2 * S;
  const hearts = Math.ceil(p.maxHp / 2);
  const perRow = Math.min(hearts, Math.floor((W - 100 * S) / (10 * hs)));
  for (let i = 0; i < hearts; i++) {
    const col = i % perRow, row = (i / perRow) | 0;
    const x = 12 * S + col * 10 * hs, y = top + row * 9 * hs;
    const v = clamp(p.hp - i * 2, 0, 2);
    sprite(ctx, v >= 2 ? SPR.heart : v >= 1 ? heartHalf : heartEmpty, x, y, hs);
  }

  // コイン・カギ
  const rowsH = Math.ceil(hearts / Math.max(1, perRow)) * 9 * hs;
  let ix = 12 * S, iy = top + rowsH + 3 * S;
  sprite(ctx, SPR.coin, ix, iy, 2 * S);
  txt(ctx, String(p.coins), ix + 20 * S, iy + 2 * S, { size: 13 * S, color: UI.gold });
  ix += 20 * S + ctx.measureText(String(p.coins)).width + 14 * S;
  if (p.keys > 0) {
    sprite(ctx, SPR.key, ix, iy, 2 * S);
    txt(ctx, String(p.keys), ix + 18 * S, iy + 2 * S, { size: 13 * S, color: UI.ink });
    ix += 18 * S + 20 * S;
  }
  if (p.relics > 0) {
    sprite(ctx, SPR.gem, ix, iy, 2 * S);
    txt(ctx, `${p.relics}/3`, ix + 18 * S, iy + 2 * S, { size: 13 * S, color: PAL.C });
  }
  const hudBottom = iy + 20 * S;

  // 右上ボタン（メニュー・マップ）
  const hb = hudButtonLayout();
  drawIconButton(ctx, hb.menu.x, hb.menu.y, hb.menu.icon, 'menu');
  drawIconButton(ctx, hb.map.x, hb.map.y, hb.map.icon, 'map');

  // ボス HP（左上のステータス表示の下に置く。かぶらないように）
  const boss = g.enemies.find(e => e.boss && !e.dead && e.aggro);
  if (boss) {
    const bw = Math.min(W - 40 * S, 250 * S), bh = 11 * S;
    const bxx = (W - bw) / 2, byy = hudBottom + 10 * S;
    panel(ctx, bxx - 5 * S, byy - 3 * S, bw + 10 * S, bh + 21 * S, { r: 6 * S, inner: false });
    txt(ctx, boss.def.name, bxx + bw / 2, byy, { size: 10.5 * S, align: 'center', color: UI.gold, outline: false });
    const yy = byy + 15 * S;
    ctx.fillStyle = '#2a1420'; ctx.fillRect(bxx, yy, bw, bh);
    ctx.fillStyle = UI.red;
    ctx.fillRect(bxx, yy, bw * clamp(boss.hp / boss.maxHp, 0, 1), bh);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(bxx + 0.5, yy + 0.5, bw - 1, bh - 1);
  }

  // トースト
  if (ui.toastT > 0) {
    const a = clamp(ui.toastT / 0.4, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = `600 ${14 * S}px ${FONT}`;
    const w1 = ctx.measureText(ui.toastText).width;
    ctx.font = `600 ${11 * S}px ${FONT}`;
    const w2 = ui.toastSub ? ctx.measureText(ui.toastSub).width : 0;
    const tw = Math.min(view.cssW - 24 * S, Math.max(w1, w2, 120 * S) + 40 * S);
    const th = ui.toastSub ? 52 * S : 36 * S;
    const tx = (W - tw) / 2, ty = view.cssH * 0.30;
    panel(ctx, tx, ty, tw, th, { r: 8 * S });
    txt(ctx, ui.toastText, W / 2, ty + 10 * S, { size: 14 * S, align: 'center', color: UI.gold, outline: false });
    if (ui.toastSub) txt(ctx, ui.toastSub, W / 2, ty + 30 * S, { size: 11 * S, align: 'center', color: UI.inkDim, outline: false });
    ctx.globalAlpha = 1;
  }

  // 操作ヒント
  if (ui.hint) {
    const hy = view.cssH - ui.padBottom - 150 * S;
    txt(ctx, ui.hint, W / 2, hy, { size: 12 * S, align: 'center', color: UI.ink });
  }
}

function drawIconButton(ctx, cx, cy, r, kind) {
  const S = ui.S;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU);
  ctx.fillStyle = 'rgba(20,16,26,0.72)'; ctx.fill();
  ctx.strokeStyle = 'rgba(210,196,164,0.45)'; ctx.lineWidth = 1.4 * S; ctx.stroke();
  ctx.strokeStyle = UI.ink; ctx.lineWidth = 2 * S; ctx.lineCap = 'round';
  if (kind === 'menu') {
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(cx - 6 * S, cy + i * 5 * S); ctx.lineTo(cx + 6 * S, cy + i * 5 * S);
      ctx.stroke();
    }
  } else {
    ctx.beginPath();
    ctx.moveTo(cx - 7 * S, cy - 5 * S); ctx.lineTo(cx - 2 * S, cy - 7 * S);
    ctx.lineTo(cx + 3 * S, cy - 4 * S); ctx.lineTo(cx + 7 * S, cy - 6 * S);
    ctx.lineTo(cx + 7 * S, cy + 6 * S); ctx.lineTo(cx + 3 * S, cy + 8 * S);
    ctx.lineTo(cx - 2 * S, cy + 5 * S); ctx.lineTo(cx - 7 * S, cy + 7 * S);
    ctx.closePath(); ctx.stroke();
  }
}

// --- タッチ操作の表示 ------------------------------------------------------

/** 右上のアイコンボタン。当たり判定が画面外へはみ出さないよう内側へ寄せる。 */
function hudButtonLayout() {
  const S = ui.S, W = view.cssW;
  const r = 21 * S;                       // 指で押しやすい判定サイズ
  const y = Math.max(r + 2 * S, ui.padTop + 12 * S);
  return {
    menu: { x: Math.min(W - r - 2 * S, W - 26 * S), y, r, icon: 17 * S },
    map: { x: Math.min(W - r - 2 * S, W - 26 * S) - 42 * S, y, r, icon: 17 * S },
  };
}

function controlLayout() {
  const S = ui.S, W = view.cssW, H = view.cssH;
  const ay = H - ui.padBottom - 62 * S;
  return {
    a: { x: W - 56 * S, y: ay, r: 38 * S },
    b: { x: W - 122 * S, y: ay + 18 * S, r: 26 * S },
    swap: { x: W - 122 * S, y: ay - 26 * S, r: 15 * S },
    S,
  };
}

function drawTouchControls(ctx, g) {
  const S = ui.S;
  const L = controlLayout();
  const p = g.player;

  // フローティングスティック
  if (input.stick.active && !input.gStill) {
    const s = input.stick;
    ctx.globalAlpha = 0.30;
    ctx.beginPath(); ctx.arc(s.ox, s.oy, 34 * S, 0, TAU);
    ctx.fillStyle = '#000'; ctx.fill();
    ctx.strokeStyle = UI.ink; ctx.lineWidth = 2 * S; ctx.stroke();
    ctx.globalAlpha = 0.7;
    let dx = s.x - s.ox, dy = s.y - s.oy;
    const d = Math.hypot(dx, dy);
    if (d > 34 * S) { dx = dx / d * 34 * S; dy = dy / d * 34 * S; }
    ctx.beginPath(); ctx.arc(s.ox + dx, s.oy + dy, 15 * S, 0, TAU);
    ctx.fillStyle = UI.ink; ctx.fill();
    ctx.globalAlpha = 1;
  }
  // ため中のリング
  if (input.gStill && input.gHeld > 0.1) {
    const t = clamp(input.gHeld / 0.42, 0, 1);
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.arc(input.stick.ox, input.stick.oy, 26 * S, -Math.PI / 2, -Math.PI / 2 + TAU * t);
    ctx.strokeStyle = t >= 1 ? UI.gold : UI.ink;
    ctx.lineWidth = 4 * S; ctx.lineCap = 'round';
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (!ui.showControls) return;

  // A ボタン
  const aDown = input.a;
  ctx.globalAlpha = aDown ? 0.95 : 0.62;
  ctx.beginPath(); ctx.arc(L.a.x, L.a.y, L.a.r, 0, TAU);
  ctx.fillStyle = aDown ? '#7a4750' : 'rgba(30,22,34,0.8)'; ctx.fill();
  ctx.strokeStyle = UI.red; ctx.lineWidth = 2.4 * S; ctx.stroke();
  ctx.globalAlpha = 1;
  drawSwordIcon(ctx, L.a.x, L.a.y, 16 * S);

  // B ボタン（道具）
  const item = p.item;
  const cnt = item === 'bomb' ? p.bombs : item === 'potion' ? p.potions : p.mp;
  ctx.globalAlpha = input.b ? 0.95 : 0.55;
  ctx.beginPath(); ctx.arc(L.b.x, L.b.y, L.b.r, 0, TAU);
  ctx.fillStyle = input.b ? '#4a5a7a' : 'rgba(30,22,34,0.8)'; ctx.fill();
  ctx.strokeStyle = PAL.j; ctx.lineWidth = 2.2 * S; ctx.stroke();
  ctx.globalAlpha = 1;
  const iconOf = (k) => (k === 'bomb' ? SPR.bomb : k === 'potion' ? SPR.potion : SPR.gem);
  sprite(ctx, iconOf(item), L.b.x - 10 * S, L.b.y - 12 * S, 2.4 * S);
  txt(ctx, String(cnt), L.b.x + 16 * S, L.b.y + 4 * S, { size: 12 * S, align: 'right', color: cnt > 0 ? UI.ink : '#7c6f84' });

  // 道具の切り替え（次の道具が小さく見えている）
  const order = ['bomb', 'potion'];
  if (p.magic) order.push('magic');
  if (order.length > 1) {
    const next = order[(order.indexOf(item) + 1) % order.length];
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(L.swap.x, L.swap.y, L.swap.r, 0, TAU);
    ctx.fillStyle = 'rgba(30,22,34,0.8)'; ctx.fill();
    ctx.strokeStyle = PAL.w; ctx.lineWidth = 1.6 * S; ctx.stroke();
    ctx.globalAlpha = 0.85;
    sprite(ctx, iconOf(next), L.swap.x - 6 * S, L.swap.y - 7 * S, 1.5 * S);
    ctx.globalAlpha = 1;
    // 循環をあらわす小さな矢印
    ctx.strokeStyle = PAL.x; ctx.lineWidth = 1.2 * S;
    ctx.beginPath();
    ctx.arc(L.swap.x, L.swap.y, L.swap.r - 3 * S, -0.6, 1.6);
    ctx.stroke();
  }
}

function drawSwordIcon(ctx, cx, cy, r) {
  const S = ui.S;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-Math.PI / 4);
  ctx.fillStyle = PAL.x;
  ctx.fillRect(-2 * S, -r, 4 * S, r * 1.5);
  ctx.fillStyle = PAL.y;
  ctx.fillRect(-2 * S, -r, 2 * S, r * 1.5);
  ctx.fillStyle = PAL.s;
  ctx.fillRect(-7 * S, r * 0.5, 14 * S, 3.5 * S);
  ctx.fillStyle = PAL.d;
  ctx.fillRect(-2.5 * S, r * 0.5, 5 * S, r * 0.45);
  ctx.restore();
}

// --- マップ ----------------------------------------------------------------

let mapCanvas = null, mapDirty = true, mapLevelId = null;
function invalidateMap() { mapDirty = true; }

const MAP_COLOR = {
  grass: '#5f8a4c', forest: '#456a3c', sand: '#deb383', dirt: '#96683f',
  marsh: '#3d5347', ash: '#3a3340', stone: '#5c5c68', water: '#2f5580',
  deep: '#1b3352', floor: '#4a4352', cliff: '#8b8b97', wall: '#2a2233', wallRuin: '#2e2a34',
};

function buildMap(level) {
  const c = makeCanvas(level.w, level.h);
  const x = c.getContext('2d');
  const img = x.createImageData(level.w, level.h);
  for (let i = 0; i < level.w * level.h; i++) {
    const o = i * 4;
    if (!level.explored[i]) { img.data[o + 3] = 0; continue; }
    const hex = MAP_COLOR[TERRAIN_NAME[level.ground[i]]] || '#000';
    img.data[o] = parseInt(hex.slice(1, 3), 16);
    img.data[o + 1] = parseInt(hex.slice(3, 5), 16);
    img.data[o + 2] = parseInt(hex.slice(5, 7), 16);
    img.data[o + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  return c;
}

function drawMap(ctx, g) {
  const S = ui.S, W = view.cssW, H = view.cssH;
  const level = g.level;
  if (mapDirty || mapLevelId !== level.id || !mapCanvas) {
    mapCanvas = buildMap(level);
    mapDirty = false; mapLevelId = level.id;
  }
  ctx.fillStyle = 'rgba(6,5,10,0.86)';
  ctx.fillRect(0, 0, W, H);

  const pad = 18 * S;
  const availW = W - pad * 2, availH = H - 150 * S;
  const sc = Math.min(availW / level.w, availH / level.h);
  const mw = level.w * sc, mh = level.h * sc;
  const mx = (W - mw) / 2, my = 90 * S;

  panel(ctx, mx - 8 * S, my - 8 * S, mw + 16 * S, mh + 16 * S, { r: 8 * S });
  ctx.fillStyle = '#15121c';
  ctx.fillRect(mx, my, mw, mh);
  ctx.strokeStyle = 'rgba(255,255,255,0.035)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 6; i++) {
    ctx.beginPath();
    ctx.moveTo(mx + (mw * i) / 6, my); ctx.lineTo(mx + (mw * i) / 6, my + mh);
    ctx.moveTo(mx, my + (mh * i) / 6); ctx.lineTo(mx + mw, my + (mh * i) / 6);
    ctx.stroke();
  }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(mapCanvas, mx, my, mw, mh);

  txt(ctx, level.name || 'マップ', W / 2, 46 * S, { size: 18 * S, align: 'center', color: UI.gold });

  const mark = (tx, ty, color, size = 3.2) => {
    const x = mx + tx * sc, y = my + ty * sc;
    ctx.fillStyle = color;
    ctx.fillRect(x - size * S / 2, y - size * S / 2, size * S, size * S);
  };
  const explored = (tx, ty) => level.explored[ty * level.w + tx];

  if (level.id === 'field') {
    const ow = g.overworld;
    for (const b of level.buildings) if (b.built) mark(b.x + b.w / 2, b.y + b.h / 2, '#e8c46a', 4);
    // ほら穴と門は「行き先」なので未探索でも うっすら見える
    for (const d of ow.dungeons) {
      const seen = explored(d.x, d.y);
      ctx.globalAlpha = seen ? 1 : 0.42;
      mark(d.x, d.y, d.cleared ? '#7fb8d4' : '#d65c4e', seen ? 5 : 4);
      ctx.globalAlpha = 1;
    }
    if (ow.gate) {
      const seen = explored(ow.gate.x, ow.gate.y);
      ctx.globalAlpha = seen ? 1 : 0.42;
      mark(ow.gate.x, ow.gate.y, '#e6c2f5', seen ? 5 : 4);
      ctx.globalAlpha = 1;
    }
    for (const v of ow.villagers) if (!v.freed && explored(v.x, v.y)) mark(v.x, v.y, '#b57ad4', 4);
  } else {
    for (let y = 0; y < level.h; y++)
      for (let x = 0; x < level.w; x++) {
        if (!explored(x, y)) continue;
        const o = level.obj[y * level.w + x];
        if (o === O.CHEST) mark(x, y, '#e8c46a', 3.5);
        else if (o === O.EXIT) mark(x, y, '#7fb8d4', 4);
        else if (o === O.DOOR) mark(x, y, '#d65c4e', 3.5);
      }
  }
  // プレイヤー
  const px = mx + (g.player.x / TILE) * sc, py = my + (g.player.y / TILE) * sc;
  const pulse = 3 + Math.sin(performance.now() / 200) * 1.2;
  ctx.beginPath(); ctx.arc(px, py, pulse * S, 0, TAU);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1 * S; ctx.stroke();

  txt(ctx, `探索 ${mapPercent(level)}%   ⏱ ${formatTime(g.playTime)}`, W / 2, my + mh + 22 * S,
    { size: 12 * S, align: 'center', color: UI.inkDim });
  const obj = g.objectiveText ? g.objectiveText() : '';
  if (obj) txt(ctx, '▶ ' + obj, W / 2, my + mh + 44 * S, { size: 13 * S, align: 'center', color: UI.gold });
  // 凡例
  const leg = [['#e8c46a', '村'], ['#d65c4e', 'ほら穴'], ['#7fb8d4', 'クリア'], ['#b57ad4', '村人'], ['#e6c2f5', '門']];
  let lx = W / 2 - (leg.length * 56 * S) / 2;
  for (const [c, label] of leg) {
    ctx.fillStyle = c;
    ctx.fillRect(lx, my + mh + 70 * S, 6 * S, 6 * S);
    txt(ctx, label, lx + 11 * S, my + mh + 68 * S, { size: 10 * S, color: UI.inkDim, outline: false });
    lx += 56 * S;
  }
  txt(ctx, 'タップでとじる', W / 2, H - ui.padBottom - 34 * S, { size: 12 * S, align: 'center', color: UI.inkDim });
}

function mapPercent(level) {
  let n = 0, tot = level.w * level.h;
  for (let i = 0; i < tot; i++) if (level.explored[i]) n++;
  return Math.round((n / tot) * 100);
}

// --- タイトル --------------------------------------------------------------

function drawTitle(ctx, g, t, canContinue) {
  const S = ui.S, W = view.cssW, H = view.cssH;
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#151024');
  grd.addColorStop(0.55, '#241a2e');
  grd.addColorStop(1, '#3a2a30');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  // 星
  for (let i = 0; i < 60; i++) {
    const x = ((i * 9973) % 1000) / 1000 * W;
    const y = ((i * 7919) % 700) / 1000 * H;
    const a = 0.3 + 0.7 * Math.abs(Math.sin(t * 0.8 + i));
    ctx.globalAlpha = a * 0.7;
    ctx.fillStyle = i % 5 === 0 ? '#e8c46a' : '#ffffff';
    ctx.fillRect(x, y, 2 * S, 2 * S);
  }
  ctx.globalAlpha = 1;

  // 丘のシルエット
  ctx.fillStyle = '#1c1526';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.72);
  for (let x = 0; x <= W; x += 8) {
    ctx.lineTo(x, H * 0.72 + Math.sin(x / 90 + 1.2) * 18 * S + Math.sin(x / 33) * 5 * S);
  }
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#120d19';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.82);
  for (let x = 0; x <= W; x += 8) ctx.lineTo(x, H * 0.82 + Math.sin(x / 60 + 3) * 12 * S);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

  // 主人公
  const hx = W / 2, hy = H * 0.735 + Math.sin(t * 2) * 1.5;
  ctx.imageSmoothingEnabled = false;
  const scale = 4 * S;
  ctx.drawImage(SPR.hero[3][Math.floor(t * 2) % 2], hx - 8 * scale, hy - 16 * scale, 16 * scale, 16 * scale);

  txt(ctx, 'AFTERGROVE', W / 2, H * 0.20, { size: 34 * S, align: 'center', color: '#e8c46a', weight: 800 });
  txt(ctx, 'アフターグローヴ', W / 2, H * 0.20 + 42 * S, { size: 13 * S, align: 'center', color: '#c2b8a4' });
  txt(ctx, '— ちいさな村を、もういちど —', W / 2, H * 0.20 + 64 * S, { size: 11 * S, align: 'center', color: '#8d8496' });

  const bw = Math.min(240 * S, W - 60 * S), bh = 46 * S;
  const by = H * 0.50;
  const btn = (label, sub, y, hot) => {
    panel(ctx, (W - bw) / 2, y, bw, bh, { r: 10 * S, fill: hot ? 'rgba(90,70,110,0.92)' : 'rgba(24,19,32,0.9)', edge: hot ? UI.gold : UI.panelEdge });
    txt(ctx, label, W / 2, y + (sub ? 8 * S : 14 * S), { size: 15 * S, align: 'center', color: UI.ink, outline: false });
    if (sub) txt(ctx, sub, W / 2, y + 27 * S, { size: 10.5 * S, align: 'center', color: UI.inkDim, outline: false });
  };
  if (canContinue) {
    btn('つづきから', g.saveSummary || '', by, true);
    btn('はじめから', 'あたらしい世界で遊ぶ', by + bh + 12 * S, false);
  } else {
    btn('はじめる', 'タップしてスタート', by, true);
  }

  txt(ctx, 'ドラッグで移動 ・ タップで斬る ・ 長押しでためる',
    W / 2, H - ui.padBottom - 44 * S, { size: 11 * S, align: 'center', color: '#9a90a6' });
}

function titleButtons(canContinue) {
  const S = ui.S, W = view.cssW, H = view.cssH;
  const bw = Math.min(240 * S, W - 60 * S), bh = 46 * S;
  const by = H * 0.50;
  const list = [{ id: 'title0', x: W / 2, y: by + bh / 2, hw: bw / 2, hh: bh / 2 }];
  if (canContinue) list.push({ id: 'title1', x: W / 2, y: by + bh + 12 * S + bh / 2, hw: bw / 2, hh: bh / 2 });
  return list;
}

function drawGameOver(ctx, g, t) {

  txt(ctx, `もっていたコインを すこし落とした`, W / 2, H * 0.36 + 58 * S, { size: 11 * S, align: 'center', color: UI.inkDim });
  const bw = Math.min(220 * S, W - 70 * S), bh = 44 * S;

}

      if (ch === 'x') arr.fill(1, i, Math.min(len, i + n));
      i += n; num = '';
      if (i >= len) break;
