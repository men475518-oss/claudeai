const __M_util = (function () {
// ---------------------------------------------------------------------------
// util.js — 数学・乱数・ノイズなどの小さな道具箱
// ---------------------------------------------------------------------------

const TAU = Math.PI * 2;

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => (b === a ? 0 : (v - a) / (b - a));
const sign = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);

/** 値を目標へ一定速度で近づける（フレーム時間つき） */
function approach(v, target, step) {
  if (v < target) return Math.min(v + step, target);
  if (v > target) return Math.max(v - step, target);
  return target;
}

const dist2 = (ax, ay, bx, by) => {
  const dx = bx - ax, dy = by - ay;
  return dx * dx + dy * dy;
};
const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));

/** -PI..PI に正規化 */
function wrapAngle(a) {
  while (a > Math.PI) a -= TAU;
  while (a < -Math.PI) a += TAU;
  return a;
}

/** 矩形同士の重なり判定（中心座標＋半幅） */
function overlaps(ax, ay, ahw, ahh, bx, by, bhw, bhh) {
  return Math.abs(ax - bx) < ahw + bhw && Math.abs(ay - by) < ahh + bhh;
}

/** イージング */
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInCubic = (t) => t * t * t;
const easeOutBack = (t) => {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
};
const easeInOutQuad = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

// --- 決定論的乱数 (mulberry32) -------------------------------------------

function makeRng(seed) {
  let a = (seed >>> 0) || 1;
  const rng = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.int = (n) => Math.floor(rng() * n);
  rng.range = (lo, hi) => lo + rng() * (hi - lo);
  rng.irange = (lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));
  rng.pick = (arr) => arr[Math.floor(rng() * arr.length)];
  rng.chance = (p) => rng() < p;
  rng.shuffle = (arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };
  rng.angle = () => rng() * TAU;
  return rng;
}

/** 文字列 → 32bit シード */
function hashSeed(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

/** 座標ハッシュ：同じ (x,y,seed) は常に同じ 0..1 を返す */
function hash2(x, y, seed = 0) {
  let h = (Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(seed | 0, 0x9e3779b1)) >>> 0;
  h = Math.imul(h ^ (h >>> 15), h | 1) >>> 0;
  h ^= h + Math.imul(h ^ (h >>> 7), h | 61);
  return ((h ^ (h >>> 14)) >>> 0) / 4294967296;
}

// --- 値ノイズ（バイオーム生成用） ----------------------------------------

const smooth = (t) => t * t * (3 - 2 * t);

/** 2D 値ノイズ。周波数 f、シード seed。戻り値 0..1 */
function valueNoise(x, y, seed = 0) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = smooth(xf), v = smooth(yf);
  const a = hash2(xi, yi, seed);
  const b = hash2(xi + 1, yi, seed);
  const c = hash2(xi, yi + 1, seed);
  const d = hash2(xi + 1, yi + 1, seed);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}

/** オクターブ重ね掛け（fBm）。戻り値 0..1 */
function fbm(x, y, seed = 0, octaves = 4, lacunarity = 2, gain = 0.5) {
  let amp = 1, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += amp * valueNoise(x * freq, y * freq, seed + i * 1013);
    norm += amp;
    amp *= gain;
    freq *= lacunarity;
  }
  return sum / norm;
}

/** リッジノイズ（山脈・崖の生成に） */
function ridge(x, y, seed = 0, octaves = 3) {
  let amp = 1, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < octaves; i++) {
    const n = 1 - Math.abs(valueNoise(x * freq, y * freq, seed + i * 733) * 2 - 1);
    sum += amp * n * n;
    norm += amp;
    amp *= 0.5;
    freq *= 2;
  }
  return sum / norm;
}

// --- 汎用 ------------------------------------------------------------------

/** 配列から条件に合う最初の要素を取り除く */
function removeItem(arr, item) {
  const i = arr.indexOf(item);
  if (i >= 0) arr.splice(i, 1);
  return i >= 0;
}

/** 数値を 0 埋め */
const pad = (n, w = 2) => String(n).padStart(w, '0');

/** 秒 → mm:ss */
function formatTime(sec) {
  const s = Math.max(0, Math.floor(sec));
  return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
}

/** 4方向を角度から求める (0:下 1:左 2:右 3:上) */
function dirFromVec(dx, dy) {
  if (Math.abs(dx) > Math.abs(dy)) return dx < 0 ? 1 : 2;
  return dy < 0 ? 3 : 0;
}

  [-1, 0],  // 1 左
  [1, 0],   // 2 右
  [0, -1],  // 3 上
];

  ctx.fillStyle = PAL['0'];
  ctx.beginPath(); ctx.moveTo(6 + bl, -3); ctx.lineTo(6 + bl + 4, 0); ctx.lineTo(6 + bl, 3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = PAL.x;
  ctx.beginPath(); ctx.moveTo(6 + bl, -2); ctx.lineTo(6 + bl + 3, 0); ctx.lineTo(6 + bl, 2); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/** 振りの軌跡と剣 */
function drawSword(ctx, p) {
  const px = Math.round(p.x), py = Math.round(p.y - 7);
  const bladeLen = 12 + Math.min(3, p.swordLv);

  if (p.spin > 0) {
    const t = 1 - p.spin / PLAYER.spinTime;
    const a0 = t * TAU * 2.2;
    ctx.save();
    ctx.translate(px, py);
    for (let k = 1; k <= 4; k++) {
      ctx.globalAlpha = 0.55 - k * 0.11;
      ctx.strokeStyle = k < 2 ? PAL.y : PAL.k;
      ctx.lineWidth = 3.2 - k * 0.6;
      ctx.beginPath();
      ctx.arc(0, 0, bladeLen + 3, a0 - k * 0.42, a0 - (k - 1) * 0.42);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    drawBlade(ctx, a0, bladeLen, true);
    ctx.restore();
    return;
  }

  if (p.attack <= 0) return;
  const t = 1 - p.attack / PLAYER.attackTime;
  const base = [Math.PI / 2, Math.PI, 0, -Math.PI / 2][p.attackDir];
  const swing = p.combo === 0 ? 1 : -1;
  const a = base + swing * lerp(-1.15, 1.15, easeOutCubic(t));
  const s = Math.sin(t * Math.PI);

  ctx.save();
  ctx.translate(px, py);
  // 振り抜いた跡
  ctx.globalAlpha = s * 0.9;
  ctx.strokeStyle = PAL.y;
  ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.arc(0, 0, bladeLen + 3, a - swing * 0.8, a, swing < 0); ctx.stroke();
  ctx.globalAlpha = s * 0.45;
  ctx.strokeStyle = PAL.k;
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, 0, bladeLen - 2, a - swing * 1.0, a, swing < 0); ctx.stroke();
  ctx.globalAlpha = 1;
  drawBlade(ctx, a, bladeLen, false);
  ctx.restore();
}

// ---------------------------------------------------------------------------
// 敵
// ---------------------------------------------------------------------------
const ENEMY_DEF = {
  slime:    { hp: 4,  speed: 26, dmg: 1, spr: 'slime',    ai: 'hop',    coin: [2, 4],  hw: 6, hh: 4, shadow: 6, name: 'スライム' },
  bat:      { hp: 3,  speed: 52, dmg: 1, spr: 'bat',      ai: 'flyer',  coin: [2, 4],  hw: 5, hh: 4, shadow: 4, fly: 1, name: 'コウモリ' },
  skeleton: { hp: 7,  speed: 32, dmg: 2, spr: 'skeleton', ai: 'chaser', coin: [4, 8],  hw: 5, hh: 4, shadow: 5, name: 'がいこつ' },
  spore:    { hp: 6,  speed: 0,  dmg: 1, spr: 'spore',    ai: 'turret', coin: [3, 6],  hw: 6, hh: 4, shadow: 6, name: 'キノコ' },
  wolf:     { hp: 6,  speed: 42, dmg: 2, spr: 'wolf',     ai: 'dasher', coin: [4, 8],  hw: 7, hh: 4, shadow: 7, name: 'やまいぬ' },
  warden:   { hp: 46, speed: 26, dmg: 2, spr: 'warden',   ai: 'aiBoss',   coin: [60, 90], hw: 12, hh: 8, shadow: 13, scale: 2, boss: 1, name: '根の番人' },
};

class Enemy extends Entity {
  constructor(x, y, kind, level = 1) {
    super(x, y);
    const d = ENEMY_DEF[kind] || ENEMY_DEF.slime;
    this.kind = kind; this.def = d;
    this.level = level;
    this.maxHp = Math.round(d.hp * (1 + 0.35 * (level - 1)));
    this.hp = this.maxHp;
    this.dmg = d.dmg + (level > 2 ? 1 : 0);
    this.speed = d.speed;
    this.hw = d.hw; this.hh = d.hh;
    this.shadow = d.shadow;
    this.scale = d.scale || 1;
    this.fly = !!d.fly;
    this.boss = !!d.boss;
    this.state = 'idle';
    this.t = rng() * 3;
    this.cd = rng.range(0.4, 1.6);
    this.phase = 0;
    this.wobble = rng() * TAU;
    this.home = { x, y };
    this.aggro = false;
    this.flash = 0;
    this.stun = 0;
    if (this.fly) this.z = 8;
  }

  hurt(g, amount, fromX, fromY, kb = 130) {
    if (this.hp <= 0) return;
    this.hp -= amount;
    this.flash = 0.14;
    this.aggro = true;
    this.stun = this.boss ? 0.06 : 0.16;
    const a = Math.atan2(this.y - fromY, this.x - fromX);
    const k = this.boss ? kb * 0.25 : kb;
    this.kbx = Math.cos(a) * k; this.kby = Math.sin(a) * k;
    FX.burst(this.x, this.y - 6, this.boss ? 10 : 6, [PAL.y, PAL.s, PAL.o], { spMax: 90 });
    FX.floatText(this.x + rng.range(-3, 3), this.y - 12 - this.z, String(amount), PAL.t, { size: 7 });
    sfx(this.boss ? 'hitHard' : 'hit');
    FX.hitstop(this.boss ? 0.05 : 0.035);
    FX.shake(this.boss ? 2.2 : 1.4, 0.14);
    if (this.hp <= 0) this.die(g);
  }

  die(g) {
    this.dead = true;
    FX.burst(this.x, this.y - 6, this.boss ? 34 : 12, [PAL.y, PAL.x, PAL.o, PAL.s], { spMax: this.boss ? 150 : 90, life: 0.7 });
    FX.ring(this.x, this.y - 5, { r0: 3, r1: this.boss ? 44 : 20, life: 0.36, color: PAL.t });
    FX.shake(this.boss ? 7 : 2, this.boss ? 0.5 : 0.16);
    sfx(this.boss ? 'bomb' : 'die');
    const n = rng.irange(this.def.coin[0], this.def.coin[1]);
    const drops = Math.min(n, 8);
    const per = Math.ceil(n / drops);
    for (let i = 0; i < drops; i++) g.spawnPickup(this.x, this.y, 'coin', per);
    if (rng() < (this.boss ? 1 : 0.16)) g.spawnPickup(this.x, this.y, 'heart');
    if (this.boss) {
      for (let i = 0; i < 3; i++) g.spawnPickup(this.x, this.y, 'heart');
      g.onBossDefeated?.(this);
    } else if (rng() < 0.05) g.spawnPickup(this.x, this.y, 'gem');
  }

  update(dt, g) {
    if (this.hp <= 0) return;
    this.t += dt;
    this.flash = Math.max(0, this.flash - dt);
    this.stun = Math.max(0, this.stun - dt);
    this.cd -= dt;
    const p = g.player;
    const d = dist(this.x, this.y, p.x, p.y);
    if (!this.aggro && d < (this.boss ? 200 : 92)) this.aggro = true;
    if (this.aggro && d > 260 && !this.boss) this.aggro = false;

    if (this.stun <= 0 && p.hp > 0) this[this.def.ai](dt, g, p, d);
    this.applyKnockback(dt, g, this.fly);

    // 接触ダメージ
    if (p.hp > 0 && Math.abs(this.x - p.x) < this.hw + p.hw + 2 &&
        Math.abs(this.y - p.y) < this.hh + p.hh + 4 && Math.abs(this.z - p.z) < 14) {
      p.hurt(g, this.dmg, this.x, this.y);
    }
  }

  // --- AI ---
  hop(dt, g, p, d) {
    if (this.z > 0 || this.vz > 0) {
      this.z += this.vz * dt; this.vz -= 260 * dt;
      this.moveBy(g, this.vx * dt, this.vy * dt);
      if (this.z <= 0) { this.z = 0; this.vz = 0; this.vx = this.vy = 0; FX.dust(this.x, this.y, 3); }
      return;
    }
    if (this.cd <= 0) {
      this.cd = rng.range(0.7, 1.3);
      const a = this.aggro ? Math.atan2(p.y - this.y, p.x - this.x) + rng.range(-0.3, 0.3) : rng.angle();
      const sp = this.speed * (this.aggro ? 1.5 : 0.7);
      this.vx = Math.cos(a) * sp; this.vy = Math.sin(a) * sp;
      this.vz = 62;
      this.dir = dirFromVec(this.vx, this.vy);
    }
  }

  flyer(dt, g, p, d) {
    this.wobble += dt * 6;
    this.z = 8 + Math.sin(this.wobble) * 3;
    let ax, ay;
    if (this.aggro) {
      ax = p.x - this.x; ay = p.y - this.y;
    } else {
      ax = this.home.x - this.x + Math.cos(this.t * 1.3) * 40;
      ay = this.home.y - this.y + Math.sin(this.t * 1.7) * 40;
    }
    const l = Math.hypot(ax, ay) || 1;
    const sp = this.speed * (this.aggro ? 1 : 0.55);
    this.vx = lerp(this.vx, (ax / l) * sp + Math.cos(this.wobble * 1.7) * 20, 0.06);
    this.vy = lerp(this.vy, (ay / l) * sp + Math.sin(this.wobble * 2.1) * 14, 0.06);
    this.moveBy(g, this.vx * dt, this.vy * dt, true);
    this.dir = dirFromVec(this.vx, this.vy);
  }

  chaser(dt, g, p, d) {
    if (!this.aggro) {
      if (this.cd <= 0) {
        this.cd = rng.range(1.0, 2.4);
        const a = rng.angle();
        this.vx = Math.cos(a) * this.speed * 0.4; this.vy = Math.sin(a) * this.speed * 0.4;
      }
      this.moveBy(g, this.vx * dt, this.vy * dt);
      return;
    }
    const a = Math.atan2(p.y - this.y, p.x - this.x);
    // 少し左右に振れて群れが重ならないように
    const off = Math.sin(this.t * 2 + this.wobble) * 0.35;
    this.vx = Math.cos(a + off) * this.speed;
    this.vy = Math.sin(a + off) * this.speed;
    this.dir = dirFromVec(this.vx, this.vy);
    this.moveBy(g, this.vx * dt, this.vy * dt);
  }

  turret(dt, g, p, d) {
    this.dir = dirFromVec(p.x - this.x, p.y - this.y);
    if (this.aggro && d < 110 && this.cd <= 0) {
      this.cd = rng.range(1.5, 2.4);
      const a = Math.atan2(p.y - this.y - 4, p.x - this.x);
      for (let i = -1; i <= 1; i++) {
        g.spawnProjectile(this.x, this.y - 8, a + i * 0.24, 62, this.dmg, 'spore');
      }
      sfx('shoot');
    }
  }

  dasher(dt, g, p, d) {
    if (this.state === 'dash') {
      this.moveBy(g, this.vx * dt, this.vy * dt);
      this.cd -= dt * 0;
      if (this.t > this.stateEnd) { this.state = 'idle'; this.cd = rng.range(0.8, 1.6); }
      if (rng() < 0.4) FX.dust(this.x, this.y, 1);
      return;
    }
    if (this.state === 'wind') {
      if (this.t > this.stateEnd) {
        this.state = 'dash'; this.stateEnd = this.t + 0.42;
        const a = Math.atan2(p.y - this.y, p.x - this.x);
        this.vx = Math.cos(a) * this.speed * 3.1;
        this.vy = Math.sin(a) * this.speed * 3.1;
        this.dir = dirFromVec(this.vx, this.vy);
        sfx('dash');
      }
      return;
    }
    if (this.aggro && d < 110 && this.cd <= 0) {
      this.state = 'wind'; this.stateEnd = this.t + 0.42;
      this.dir = dirFromVec(p.x - this.x, p.y - this.y);
      return;
    }
    if (this.cd <= 0) {
      this.cd = rng.range(0.9, 1.8);
      const a = this.aggro ? Math.atan2(p.y - this.y, p.x - this.x) + rng.range(-0.9, 0.9) : rng.angle();
      this.vx = Math.cos(a) * this.speed * 0.5; this.vy = Math.sin(a) * this.speed * 0.5;
      this.dir = dirFromVec(this.vx, this.vy);
    }
    this.moveBy(g, this.vx * dt, this.vy * dt);
  }

  aiBoss(dt, g, p, d) {
    const hpr = this.hp / this.maxHp;
    if (this.state === 'idle') {
      const a = Math.atan2(p.y - this.y, p.x - this.x);
      this.vx = lerp(this.vx, Math.cos(a) * this.speed, 0.04);
      this.vy = lerp(this.vy, Math.sin(a) * this.speed, 0.04);
      this.dir = dirFromVec(this.vx, this.vy);
      this.moveBy(g, this.vx * dt, this.vy * dt);
      if (this.cd <= 0) {
        const roll = rng();
        if (roll < 0.4) { this.state = 'wind'; this.stateEnd = this.t + 0.6; }
        else if (roll < 0.75) { this.state = 'summon'; this.stateEnd = this.t + 0.7; }
        else { this.state = 'spray'; this.stateEnd = this.t + 0.9; this.sprayN = 0; }
        this.cd = 9;
      }
    } else if (this.state === 'wind') {
      FX.dust(this.x + rng.range(-8, 8), this.y, 1);
      if (this.t > this.stateEnd) {
        this.state = 'charge'; this.stateEnd = this.t + 0.9;
        const a = Math.atan2(p.y - this.y, p.x - this.x);
        this.vx = Math.cos(a) * this.speed * 4.2;
        this.vy = Math.sin(a) * this.speed * 4.2;
        sfx('dash');
      }
    } else if (this.state === 'charge') {
      this.moveBy(g, this.vx * dt, this.vy * dt);
      FX.dust(this.x, this.y, 2);
      if (this.t > this.stateEnd) { this.state = 'idle'; this.cd = rng.range(1.2, 2.2) * (hpr < 0.5 ? 0.6 : 1); }
    } else if (this.state === 'summon') {
      if (this.t > this.stateEnd) {
        const n = hpr < 0.5 ? 3 : 2;
        for (let i = 0; i < n; i++) {
          const a = rng.angle();
          g.spawnEnemy(this.x + Math.cos(a) * 26, this.y + Math.sin(a) * 26, rng() < 0.5 ? 'bat' : 'slime', this.level);
        }
        sfx('spawn');
        FX.ring(this.x, this.y - 8, { r0: 4, r1: 40, life: 0.4, color: PAL.A });
        this.state = 'idle'; this.cd = rng.range(1.6, 2.6);
      }
    } else if (this.state === 'spray') {
      if (this.cd2 == null || this.t > this.cd2) {
        this.cd2 = this.t + 0.16;
        const base = this.t * 3.4;
        for (let i = 0; i < 4; i++) {
          g.spawnProjectile(this.x, this.y - 10, base + i * TAU / 4, 58, this.dmg, 'spore');
        }
        sfx('shoot');
        this.sprayN++;
      }
      if (this.t > this.stateEnd) { this.state = 'idle'; this.cd = rng.range(1.4, 2.4); this.cd2 = null; }
    }
  }

  draw(ctx) {
    this.drawShadow(ctx);
    let spr;
    const frames = (this.kind === 'wolf' && (this.dir === 1)) ? SPR.wolfL : SPR[this.def.spr];
    const f = Math.floor(this.t * (this.state === 'dash' || this.state === 'charge' ? 12 : 5)) % frames.length;
    spr = frames[f];
    const tel = (this.state === 'wind');
    if (tel && Math.floor(this.t * 20) % 2 === 0) {
      this.blit(ctx, spr, 0, 0, this.scale, true);
    } else {
      this.blit(ctx, spr, 0, 0, this.scale, this.flash > 0);
    }
    if (this.boss) drawBossBarWorld(ctx, this);
  }
}

function drawBossBarWorld(ctx, e) {
  const w = 30, x = Math.round(e.x - w / 2), y = Math.round(e.y - 40);
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - 1, y - 1, w + 2, 5);
  ctx.fillStyle = PAL.m; ctx.fillRect(x, y, w, 3);
  ctx.fillStyle = PAL.o; ctx.fillRect(x, y, Math.round(w * clamp(e.hp / e.maxHp, 0, 1)), 3);
}

// ---------------------------------------------------------------------------
// 弾
// ---------------------------------------------------------------------------
class Projectile extends Entity {
  constructor(x, y, angle, speed, dmg, kind, friendly = false) {
    super(x, y);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.dmg = dmg;
    this.kind = kind;
    this.friendly = friendly;
    this.life = 3.2;
    this.hw = 2; this.hh = 2;
    this.shadow = 0;
    this.t = 0;
    this.z = 8;
  }
  update(dt, g) {
    this.t += dt;
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (g.level.hits(this.x, this.y, 1, 1)) { this.burst(); return; }
    if (this.friendly) {
      for (const e of g.enemies) {
        if (e.dead || e.hp <= 0) continue;
        if (Math.abs(e.x - this.x) < e.hw + 4 && Math.abs(e.y - 4 - this.y) < e.hh + 8) {
          e.hurt(g, this.dmg, this.x, this.y, 100);
          this.burst(); return;
        }
      }
    } else {
      const p = g.player;
      if (p.hp > 0 && Math.abs(p.x - this.x) < p.hw + 3 && Math.abs(p.y - 5 - this.y) < p.hh + 6) {
        p.hurt(g, this.dmg, this.x, this.y);
        this.burst(); return;
      }
    }
    if (rng() < 0.3) FX.particle(this.x, this.y - this.z, {
      vx: 0, vy: 0, life: 0.2, size: 1, color: this.friendly ? PAL.C : PAL.b,
    });
  }
  burst() {
    this.dead = true;
    FX.burst(this.x, this.y - this.z, 5, this.friendly ? [PAL.C, PAL.B] : [PAL.b, PAL.a]);
  }
  draw(ctx) {
    const c = this.friendly ? [PAL.C, PAL.B, PAL.A] : [PAL.b, PAL.a, PAL['8']];
    const x = Math.round(this.x), y = Math.round(this.y - this.z);
    ctx.fillStyle = c[2]; ctx.fillRect(x - 2, y - 2, 4, 4);
    ctx.fillStyle = c[1]; ctx.fillRect(x - 2, y - 1, 4, 2); ctx.fillRect(x - 1, y - 2, 2, 4);
    ctx.fillStyle = c[0]; ctx.fillRect(x - 1, y - 1, 2, 2);
  }
}

// ---------------------------------------------------------------------------
// 落ちもの
// ---------------------------------------------------------------------------
const PICKUP_SPR = { coin: 'coin', heart: 'heart', key: 'key', gem: 'gem', bomb: 'bomb', potion: 'potion', star: 'star' };

class Pickup extends Entity {
  constructor(x, y, kind, amount = 1) {
    super(x, y);
    this.kind = kind; this.amount = amount;
    this.hw = 4; this.hh = 3;
    this.shadow = 3;
    const a = rng.angle();
    const sp = rng.range(14, 46);
    this.vx = Math.cos(a) * sp; this.vy = Math.sin(a) * sp;
    this.z = 3; this.vz = rng.range(40, 80);
    this.life = 26;
    this.t = rng() * 3;
    this.pull = 0;
  }
  update(dt, g) {
    this.t += dt;
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    const p = g.player;
    const d = dist(this.x, this.y, p.x, p.y);
    if (this.z > 0 || this.vz !== 0) {
      this.z += this.vz * dt; this.vz -= 240 * dt;
      this.moveBy(g, this.vx * dt, this.vy * dt);
      this.vx *= Math.pow(0.1, dt); this.vy *= Math.pow(0.1, dt);
      if (this.z <= 0) { this.z = 0; this.vz = 0; }
    } else if (d < 34 && p.hp > 0) {
      this.pull = Math.min(1, this.pull + dt * 3);
      const a = Math.atan2(p.y - 5 - this.y, p.x - this.x);
      const sp = 40 + this.pull * 190;
      this.x += Math.cos(a) * sp * dt;
      this.y += Math.sin(a) * sp * dt;
    }
    if (d < 9 && p.hp > 0) { g.collect(this); this.dead = true; }
  }
  draw(ctx) {
    if (this.life < 5 && Math.floor(this.life * 6) % 2 === 0) return;
    this.drawShadow(ctx);
    const spr = SPR[PICKUP_SPR[this.kind]] || SPR.coin;
    const bob = Math.sin(this.t * 4) * 1.2;
    this.blit(ctx, spr, 0, -1 + bob, 1);
  }
}

// ---------------------------------------------------------------------------
// NPC（村人・救出対象）
// ---------------------------------------------------------------------------
class Npc extends Entity {
  constructor(x, y, kind, data = {}) {
    super(x, y);
    this.kind = kind % SPR.villagers.length;
    this.hw = 4; this.hh = 3;
    this.shadow = 5;
    this.data = data;
    this.name = data.name || '村人';
    this.lines = data.lines || ['こんにちは。'];
    this.t = rng() * 5;
    this.home = { x, y };
    this.walkT = 0;
    this.cd = rng.range(1, 3);
    this.vx = 0; this.vy = 0;
    this.static = !!data.static;
    this.spr = data.spr || null;      // 村人以外の見た目（帽子の人など）
    this.bob = !!data.bob;
  }
  update(dt, g) {
    this.t += dt;
    if (this.static) return;
    this.cd -= dt;
    if (this.cd <= 0) {
      this.cd = rng.range(1.4, 3.6);
      if (rng() < 0.45) { this.vx = 0; this.vy = 0; }
      else {
        const a = rng.angle();
        this.vx = Math.cos(a) * 16; this.vy = Math.sin(a) * 16;
      }
    }
    if (this.vx || this.vy) {
      if (dist(this.x, this.y, this.home.x, this.home.y) > 40) {
        const a = Math.atan2(this.home.y - this.y, this.home.x - this.x);
        this.vx = Math.cos(a) * 16; this.vy = Math.sin(a) * 16;
      }
      this.dir = dirFromVec(this.vx, this.vy);
      this.walkT += dt * 6;
      this.moveBy(g, this.vx * dt, this.vy * dt);
    } else this.walkT = 0;
    // プレイヤーのほうを向く
    const p = g.player;
    if (dist(this.x, this.y, p.x, p.y) < 22) {
      this.dir = dirFromVec(p.x - this.x, p.y - this.y);
      this.vx = this.vy = 0; this.walkT = 0;
    }
  }
  draw(ctx) {
    this.drawShadow(ctx);
    if (this.spr && SPR[this.spr]) {
      const b = this.bob ? Math.round(Math.sin(this.t * 2) * 1.2) : 0;
      this.blit(ctx, SPR[this.spr], 0, b);

    const sx = bx + pad + i * (segW + gap);
    const filled = i < p.hp;
    ctx.fillStyle = filled ? (p.hp <= 2 && Math.floor(performance.now() / 220) % 2 === 0 ? '#ff8fa6' : '#ea3a5f') : '#221d2a';
    ctx.fillRect(sx, by + pad, segW, segH);
  }

  // --- コイン ---
  const cx0 = bx + bw + 14 * S;
  sprite(ctx, SPR.coin, cx0, by + bh / 2 - 8 * S, 2 * S);
  txt(ctx, String(p.coins), cx0 + 22 * S, by + bh / 2 - 10 * S, { size: 17 * S, color: '#ffffff', weight: 700 });

  // --- カギ・遺物（あるときだけ）---
  let iy = by + bh + 6 * S;
  let ix = bx;
  if (p.keys > 0) {
    sprite(ctx, SPR.key, ix, iy, 2 * S);
    txt(ctx, String(p.keys), ix + 18 * S, iy + 2 * S, { size: 13 * S, color: UI.ink });
    ix += 42 * S;
  }
  if (p.relics > 0) {
    sprite(ctx, SPR.gem, ix, iy, 2 * S);
    txt(ctx, `${p.relics}/3`, ix + 18 * S, iy + 2 * S, { size: 13 * S, color: PAL.C });
    ix += 52 * S;
  }

  // --- 右上ボタン ---
  const hb = hudButtonLayout();
  drawIconButton(ctx, hb.menu.x, hb.menu.y, hb.menu.icon, 'menu');
  drawIconButton(ctx, hb.map.x, hb.map.y, hb.map.icon, 'map');

  // --- ボスの体力（顔を隠さないよう画面の下側に置く）---
  const giant = g.boss && g.boss.hp > 0 && g.boss.state !== 'intro' ? g.boss : null;
  const small = giant ? null : g.enemies.find(e => e.boss && !e.dead && e.aggro);
  const bs = giant || small;
  if (bs) {
    const w2 = Math.min(W - 44 * S, 268 * S), h2 = 11 * S;
    const x2 = (W - w2) / 2;
    const y2 = view.cssH - ui.padBottom - 124 * S;
    txt(ctx, bs.name || bs.def.name, x2 + w2 / 2, y2 - 19 * S,
      { size: 12.5 * S, align: 'center', color: '#f6e3e3', weight: 700 });
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(ctx, x2 - 2 * S, y2 - 2 * S, w2 + 4 * S, h2 + 4 * S, 2 * S); ctx.fill();
    ctx.fillStyle = '#2a1420';
    ctx.fillRect(x2, y2, w2, h2);
    const ratio = clamp(bs.hp / bs.maxHp, 0, 1);
    const grd = ctx.createLinearGradient(x2, y2, x2, y2 + h2);
    grd.addColorStop(0, '#f26a72');
    grd.addColorStop(1, '#b81f3a');
    ctx.fillStyle = grd;
    ctx.fillRect(x2, y2, w2 * ratio, h2);
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.fillRect(x2, y2, w2 * ratio, 2 * S);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4 * S;
    ctx.strokeRect(x2 + 0.5, y2 + 0.5, w2 - 1, h2 - 1);
  }

  // --- トースト ---
  if (ui.toastT > 0) {
    const a = clamp(ui.toastT / 0.4, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = `600 ${14 * S}px ${FONT}`;
    const w1 = ctx.measureText(ui.toastText).width;
    ctx.font = `600 ${11 * S}px ${FONT}`;
    const w2 = ui.toastSub ? ctx.measureText(ui.toastSub).width : 0;
    const tw = Math.min(view.cssW - 24 * S, Math.max(w1, w2, 120 * S) + 40 * S);
    const th = ui.toastSub ? 52 * S : 36 * S;
    const tx = (W - tw) / 2, ty = view.cssH * 0.30;
    panel(ctx, tx, ty, tw, th, { r: 8 * S });
    txt(ctx, ui.toastText, W / 2, ty + 10 * S, { size: 14 * S, align: 'center', color: UI.gold, outline: false });
    if (ui.toastSub) txt(ctx, ui.toastSub, W / 2, ty + 30 * S, { size: 11 * S, align: 'center', color: UI.inkDim, outline: false });
    ctx.globalAlpha = 1;
  }

  // --- 画面下の説明（AfterPlace 風の白い注釈）---
  if (ui.hint && !dialog.active && !menu.active) {
    const lines = String(ui.hint).split('\n');
    const size = 13 * S;
    // ボスの体力バーが出ているときは その上へ逃がす
    const base = bs ? 176 * S : 150 * S;
    const hy = view.cssH - ui.padBottom - base - (lines.length - 1) * size * 1.4;
    ctx.globalAlpha = clamp(ui.hintT, 0, 1);
    lines.forEach((l, i) => txt(ctx, l, W / 2, hy + i * size * 1.4,
      { size, align: 'center', color: '#ffffff', weight: 600, outlineColor: 'rgba(8,6,12,0.85)' }));
    ctx.globalAlpha = 1;
  }
}

function drawIconButton(ctx, cx, cy, r, kind) {
  const S = ui.S;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU);
  ctx.fillStyle = 'rgba(20,16,26,0.72)'; ctx.fill();
  ctx.strokeStyle = 'rgba(210,196,164,0.45)'; ctx.lineWidth = 1.4 * S; ctx.stroke();
  ctx.strokeStyle = UI.ink; ctx.lineWidth = 2 * S; ctx.lineCap = 'round';
  if (kind === 'menu') {
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(cx - 6 * S, cy + i * 5 * S); ctx.lineTo(cx + 6 * S, cy + i * 5 * S);
      ctx.stroke();
    }
  } else {
    ctx.beginPath();
    ctx.moveTo(cx - 7 * S, cy - 5 * S); ctx.lineTo(cx - 2 * S, cy - 7 * S);
    ctx.lineTo(cx + 3 * S, cy - 4 * S); ctx.lineTo(cx + 7 * S, cy - 6 * S);
    ctx.lineTo(cx + 7 * S, cy + 6 * S); ctx.lineTo(cx + 3 * S, cy + 8 * S);
    ctx.lineTo(cx - 2 * S, cy + 5 * S); ctx.lineTo(cx - 7 * S, cy + 7 * S);
    ctx.closePath(); ctx.stroke();
  }
}

// --- タッチ操作の表示 ------------------------------------------------------

/** 右上のアイコンボタン。当たり判定が画面外へはみ出さないよう内側へ寄せる。 */
function hudButtonLayout() {
  const S = ui.S, W = view.cssW;
  const r = 21 * S;                       // 指で押しやすい判定サイズ
  const y = Math.max(r + 2 * S, ui.padTop + 12 * S);
  return {
    menu: { x: Math.min(W - r - 2 * S, W - 26 * S), y, r, icon: 17 * S },
    map: { x: Math.min(W - r - 2 * S, W - 26 * S) - 42 * S, y, r, icon: 17 * S },
  };
}

function controlLayout() {
  const S = ui.S, W = view.cssW, H = view.cssH;
  const ay = H - ui.padBottom - 62 * S;
  return {
    a: { x: W - 56 * S, y: ay, r: 38 * S },
    b: { x: W - 122 * S, y: ay + 18 * S, r: 26 * S },
    swap: { x: W - 122 * S, y: ay - 26 * S, r: 15 * S },
    S,
  };
}

function drawTouchControls(ctx, g) {
  const S = ui.S;
  const L = controlLayout();
  const p = g.player;

  // フローティングスティック
  if (input.stick.active && !input.gStill) {
    const s = input.stick;
    ctx.globalAlpha = 0.30;
    ctx.beginPath(); ctx.arc(s.ox, s.oy, 34 * S, 0, TAU);
    ctx.fillStyle = '#000'; ctx.fill();
    ctx.strokeStyle = UI.ink; ctx.lineWidth = 2 * S; ctx.stroke();
    ctx.globalAlpha = 0.7;
    let dx = s.x - s.ox, dy = s.y - s.oy;
    const d = Math.hypot(dx, dy);
    if (d > 34 * S) { dx = dx / d * 34 * S; dy = dy / d * 34 * S; }
    ctx.beginPath(); ctx.arc(s.ox + dx, s.oy + dy, 15 * S, 0, TAU);
    ctx.fillStyle = UI.ink; ctx.fill();
    ctx.globalAlpha = 1;
  }
  // ため中のリング
  if (input.gStill && input.gHeld > 0.1) {
    const t = clamp(input.gHeld / 0.42, 0, 1);
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.arc(input.stick.ox, input.stick.oy, 26 * S, -Math.PI / 2, -Math.PI / 2 + TAU * t);
    ctx.strokeStyle = t >= 1 ? UI.gold : UI.ink;
    ctx.lineWidth = 4 * S; ctx.lineCap = 'round';
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (!ui.showControls) return;

  // A ボタン
  const aDown = input.a;
  ctx.globalAlpha = aDown ? 0.95 : 0.62;
  ctx.beginPath(); ctx.arc(L.a.x, L.a.y, L.a.r, 0, TAU);
  ctx.fillStyle = aDown ? '#7a4750' : 'rgba(30,22,34,0.8)'; ctx.fill();
  ctx.strokeStyle = UI.red; ctx.lineWidth = 2.4 * S; ctx.stroke();
  ctx.globalAlpha = 1;
  drawSwordIcon(ctx, L.a.x, L.a.y, 16 * S);

  // B ボタン（道具）
  const item = p.item;
  const cnt = item === 'bomb' ? p.bombs : item === 'potion' ? p.potions : p.mp;
  ctx.globalAlpha = input.b ? 0.95 : 0.55;
  ctx.beginPath(); ctx.arc(L.b.x, L.b.y, L.b.r, 0, TAU);
  ctx.fillStyle = input.b ? '#4a5a7a' : 'rgba(30,22,34,0.8)'; ctx.fill();
  ctx.strokeStyle = PAL.j; ctx.lineWidth = 2.2 * S; ctx.stroke();
  ctx.globalAlpha = 1;
  const iconOf = (k) => (k === 'bomb' ? SPR.bomb : k === 'potion' ? SPR.potion : SPR.gem);
  sprite(ctx, iconOf(item), L.b.x - 10 * S, L.b.y - 12 * S, 2.4 * S);
  txt(ctx, String(cnt), L.b.x + 16 * S, L.b.y + 4 * S, { size: 12 * S, align: 'right', color: cnt > 0 ? UI.ink : '#7c6f84' });

  // 道具の切り替え（次の道具が小さく見えている）
  const order = ['bomb', 'potion'];
  if (p.magic) order.push('magic');
  if (order.length > 1) {
    const next = order[(order.indexOf(item) + 1) % order.length];
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(L.swap.x, L.swap.y, L.swap.r, 0, TAU);
    ctx.fillStyle = 'rgba(30,22,34,0.8)'; ctx.fill();
    ctx.strokeStyle = PAL.w; ctx.lineWidth = 1.6 * S; ctx.stroke();
    ctx.globalAlpha = 0.85;
    sprite(ctx, iconOf(next), L.swap.x - 6 * S, L.swap.y - 7 * S, 1.5 * S);
    ctx.globalAlpha = 1;
    // 循環をあらわす小さな矢印
    ctx.strokeStyle = PAL.x; ctx.lineWidth = 1.2 * S;
    ctx.beginPath();
    ctx.arc(L.swap.x, L.swap.y, L.swap.r - 3 * S, -0.6, 1.6);
    ctx.stroke();
  }
}

function drawSwordIcon(ctx, cx, cy, r) {
  const S = ui.S;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-Math.PI / 4);
  ctx.fillStyle = PAL.x;
  ctx.fillRect(-2 * S, -r, 4 * S, r * 1.5);
  ctx.fillStyle = PAL.y;
  ctx.fillRect(-2 * S, -r, 2 * S, r * 1.5);
  ctx.fillStyle = PAL.s;
  ctx.fillRect(-7 * S, r * 0.5, 14 * S, 3.5 * S);
  ctx.fillStyle = PAL.d;
  ctx.fillRect(-2.5 * S, r * 0.5, 5 * S, r * 0.45);
  ctx.restore();
}

// --- マップ ----------------------------------------------------------------

let mapCanvas = null, mapDirty = true, mapLevelId = null;
function invalidateMap() { mapDirty = true; }

const MAP_COLOR = {
  grass: '#5f8a4c', forest: '#456a3c', sand: '#deb383', dirt: '#96683f',
  marsh: '#3d5347', ash: '#3a3340', stone: '#5c5c68', water: '#2f5580',
  deep: '#1b3352', floor: '#4a4352', cliff: '#8b8b97', wall: '#2a2233', wallRuin: '#2e2a34',
};

function buildMap(level) {
  const c = makeCanvas(level.w, level.h);
  const x = c.getContext('2d');
  const img = x.createImageData(level.w, level.h);
  for (let i = 0; i < level.w * level.h; i++) {
    const o = i * 4;
    if (!level.explored[i]) { img.data[o + 3] = 0; continue; }
    const hex = MAP_COLOR[TERRAIN_NAME[level.ground[i]]] || '#000';
    img.data[o] = parseInt(hex.slice(1, 3), 16);
    img.data[o + 1] = parseInt(hex.slice(3, 5), 16);
    img.data[o + 2] = parseInt(hex.slice(5, 7), 16);
    img.data[o + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  return c;
}

/** 島のつながりを 点と線で描く（部屋づたいの世界なので これが読みやすい）*/
function drawRoomMap(ctx, g) {
  const S = ui.S, W = view.cssW, H = view.cssH;
  const w = g.world;
  const here = w.rooms.get(g.roomId);

  ctx.fillStyle = 'rgba(8,10,12,0.90)';
  ctx.fillRect(0, 0, W, H);

  // 見えている島＝行ったことがある島と、そのとなり
  const shown = new Map();
  for (const [id, r] of w.rooms) {
    if (r.visited || r.known) shown.set(id, { r, ghost: !r.visited });
    else {
      for (const d of ['n', 's', 'e', 'w']) {
        const nid = r.exits[d];
        const n = nid && w.rooms.get(nid);
        if (n && n.visited) { shown.set(id, { r, ghost: true }); break; }
      }
    }
  }
  if (!shown.size) shown.set(here.id, { r: here, ghost: false });

  let minX = 99, maxX = -99, minY = 99, maxY = -99;
  for (const { r } of shown.values()) {
    minX = Math.min(minX, r.gx); maxX = Math.max(maxX, r.gx);
    minY = Math.min(minY, r.gy); maxY = Math.max(maxY, r.gy);
  }
  const cols = maxX - minX + 1, rows = maxY - minY + 1;
  const padX = 26 * S, top = 78 * S, bottom = 118 * S;
  const availW = W - padX * 2, availH = H - top - bottom;
  const step = Math.max(34 * S, Math.min(availW / cols, availH / rows, 86 * S));
  const ox = (W - (cols - 1) * step) / 2 - minX * step;
  const oy = top + (availH - (rows - 1) * step) / 2 - minY * step;
  const pos = (r) => ({ x: ox + r.gx * step, y: oy + r.gy * step });

  txt(ctx, 'この あたりの 島', W / 2, 34 * S, { size: 17 * S, align: 'center', color: '#f2a4b0', weight: 700 });

  // --- 線 ---
  ctx.lineCap = 'round';
  for (const { r, ghost } of shown.values()) {
    const a = pos(r);
    for (const d of ['e', 's']) {           // 重ねて引かないよう 2 方向だけ
      const nid = r.exits[d];
      if (!nid || !shown.has(nid)) continue;
      const b = pos(w.rooms.get(nid));
      const both = !ghost && !shown.get(nid).ghost;
      ctx.strokeStyle = both ? 'rgba(236,132,148,0.75)' : 'rgba(236,132,148,0.22)';
      ctx.lineWidth = both ? 2.4 * S : 1.4 * S;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }

  // --- 島 ---
  const rx = Math.min(step * 0.44, 42 * S), ry = Math.min(step * 0.30, 26 * S);
  for (const { r, ghost } of shown.values()) {
    const c = pos(r);
    const cur = r.id === g.roomId;
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, rx, ry, 0, 0, TAU);
    ctx.fillStyle = ghost ? 'rgba(24,20,28,0.75)' : 'rgba(30,24,34,0.95)';
    ctx.fill();
    ctx.strokeStyle = cur ? '#ffd76a' : ghost ? 'rgba(236,132,148,0.35)' : '#ec8494';
    ctx.lineWidth = (cur ? 2.8 : 1.8) * S;
    ctx.stroke();

    if (ghost) {
      txt(ctx, '？', c.x, c.y - 8 * S, { size: 13 * S, align: 'center', color: 'rgba(242,164,176,0.55)', outline: false });
    } else {
      const size = Math.max(8 * S, Math.min(11 * S, rx / 2.6));
      const lines = wrapText(ctx, r.name, rx * 1.85, size).slice(0, 2);
      lines.forEach((l, i) => txt(ctx, l, c.x, c.y - (lines.length * size * 1.15) / 2 + i * size * 1.15,
        { size, align: 'center', color: cur ? '#ffe9a8' : '#f6c9d0', outline: false }));
    }

    // 目じるし
    const marks = [];
    const dg = w.dungeons.find(d => d.roomId === r.id);
    if (dg) marks.push(dg.cleared ? '#7fb8d4' : '#e0574a');
    if (r.content.gate) marks.push('#e6c2f5');
    const vil = w.villagers.find(v => v.roomId === r.id && !v.freed);
    if (vil && (r.visited || r.known)) marks.push('#b57ad4');
    if (r.kind === 'town' || r.kind === 'home') marks.push('#e8c46a');
    if (!ghost && r.content.vending) marks.push('#8f7ad0');
    marks.forEach((col, i) => {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(c.x - (marks.length - 1) * 5 * S + i * 10 * S, c.y + ry - 3 * S, 3.4 * S, 0, TAU);
      ctx.fill();
    });

    if (cur) {
      const t = performance.now() / 300;
      ctx.strokeStyle = `rgba(255,215,106,${0.35 + Math.sin(t) * 0.25})`;
      ctx.lineWidth = 2 * S;
      ctx.beginPath(); ctx.ellipse(c.x, c.y, rx + 5 * S, ry + 5 * S, 0, 0, TAU); ctx.stroke();
    }
  }

  // --- 下の情報 ---
  const visited = [...w.rooms.values()].filter(r => r.visited).length;
  txt(ctx, `${here.name}　／　${visited} / ${w.rooms.size} の島`, W / 2, H - ui.padBottom - 96 * S,
    { size: 13 * S, align: 'center', color: UI.ink });
  const obj = g.objectiveText ? g.objectiveText() : '';
  if (obj) txt(ctx, '▶ ' + obj, W / 2, H - ui.padBottom - 74 * S, { size: 13 * S, align: 'center', color: UI.gold });
  const leg = [['#e8c46a', '町・家'], ['#e0574a', 'ほら穴'], ['#b57ad4', '村人'], ['#7fb8d4', 'クリア']];
  let lx = W / 2 - (leg.length * 62 * S) / 2;
  for (const [col, label] of leg) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(lx + 3 * S, H - ui.padBottom - 46 * S, 3.4 * S, 0, TAU); ctx.fill();
    txt(ctx, label, lx + 12 * S, H - ui.padBottom - 52 * S, { size: 10.5 * S, color: UI.inkDim, outline: false });
    lx += 62 * S;
  }
  txt(ctx, 'タップでとじる', W / 2, H - ui.padBottom - 26 * S, { size: 12 * S, align: 'center', color: UI.inkDim });
}

function drawMap(ctx, g) {
  if (g.levelId && g.levelId.startsWith('room:')) return drawRoomMap(ctx, g);

  const S = ui.S, W = view.cssW, H = view.cssH;
  const level = g.level;
  if (mapDirty || mapLevelId !== level.id || !mapCanvas) {
    mapCanvas = buildMap(level);
    mapDirty = false; mapLevelId = level.id;
  }
  ctx.fillStyle = 'rgba(6,5,10,0.86)';
  ctx.fillRect(0, 0, W, H);

  const pad = 18 * S;
  const availW = W - pad * 2, availH = H - 150 * S;
  const sc = Math.min(availW / level.w, availH / level.h);
  const mw = level.w * sc, mh = level.h * sc;
  const mx = (W - mw) / 2, my = 90 * S;

  panel(ctx, mx - 8 * S, my - 8 * S, mw + 16 * S, mh + 16 * S, { r: 8 * S });
  ctx.fillStyle = '#15121c';
  ctx.fillRect(mx, my, mw, mh);
  ctx.strokeStyle = 'rgba(255,255,255,0.035)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 6; i++) {
    ctx.beginPath();
    ctx.moveTo(mx + (mw * i) / 6, my); ctx.lineTo(mx + (mw * i) / 6, my + mh);
    ctx.moveTo(mx, my + (mh * i) / 6); ctx.lineTo(mx + mw, my + (mh * i) / 6);
    ctx.stroke();
  }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(mapCanvas, mx, my, mw, mh);

  txt(ctx, level.name || 'マップ', W / 2, 46 * S, { size: 18 * S, align: 'center', color: UI.gold });

  const mark = (tx, ty, color, size = 3.2) => {
    const x = mx + tx * sc, y = my + ty * sc;
    ctx.fillStyle = color;
    ctx.fillRect(x - size * S / 2, y - size * S / 2, size * S, size * S);
  };
  const explored = (tx, ty) => level.explored[ty * level.w + tx];

  {
    for (let y = 0; y < level.h; y++)
      for (let x = 0; x < level.w; x++) {
        if (!explored(x, y)) continue;
        const o = level.obj[y * level.w + x];
        if (o === O.CHEST) mark(x, y, '#e8c46a', 3.5);
        else if (o === O.EXIT) mark(x, y, '#7fb8d4', 4);
        else if (o === O.DOOR) mark(x, y, '#d65c4e', 3.5);
      }
  }
  // プレイヤー
  const px = mx + (g.player.x / TILE) * sc, py = my + (g.player.y / TILE) * sc;
  const pulse = 3 + Math.sin(performance.now() / 200) * 1.2;
  ctx.beginPath(); ctx.arc(px, py, pulse * S, 0, TAU);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1 * S; ctx.stroke();

  txt(ctx, `探索 ${mapPercent(level)}%   ⏱ ${formatTime(g.playTime)}`, W / 2, my + mh + 22 * S,
    { size: 12 * S, align: 'center', color: UI.inkDim });
  const obj = g.objectiveText ? g.objectiveText() : '';
  if (obj) txt(ctx, '▶ ' + obj, W / 2, my + mh + 44 * S, { size: 13 * S, align: 'center', color: UI.gold });
  // 凡例
  const leg = [['#e8c46a', '村'], ['#d65c4e', 'ほら穴'], ['#7fb8d4', 'クリア'], ['#b57ad4', '村人'], ['#e6c2f5', '門']];
  let lx = W / 2 - (leg.length * 56 * S) / 2;
  for (const [c, label] of leg) {
    ctx.fillStyle = c;
    ctx.fillRect(lx, my + mh + 70 * S, 6 * S, 6 * S);
    txt(ctx, label, lx + 11 * S, my + mh + 68 * S, { size: 10 * S, color: UI.inkDim, outline: false });
    lx += 56 * S;
  }

// ---------------------------------------------------------------------------

function hasSave() {
  try { return !!localStorage.getItem(SAVE_KEY); } catch { return false; }
}

function saveGame(g) {
  try {
    const p = g.player;
    const visited = [];
    for (const [id, r] of g.world.rooms) if (r.visited) visited.push(id);
    const data = {
      v: 2,
      seed: g.seed,
      time: g.playTime,
      roomId: g.levelId.startsWith('room:') ? g.roomId : (g.returnRoomId || g.world.startId),

      bombs: p.bombs, potions: p.potions,
      swordLv: p.swordLv, magic: p.magic, mp: p.mp, maxMp: p.maxMp,
      item: p.item, relics: p.relics,
      buildings: g.world.buildings.map(b => (b.built ? 1 : 0)),
      villagers: g.world.villagers.map(v => (v.freed ? 1 : 0)),
      dungeons: g.world.dungeons.map(d => (d.cleared ? 1 : 0)),
      relicTaken: g.world.dungeons.map(d => (d.relicTaken ? 1 : 0)),
      opened: [...g.openedChests],
      visited,
      rescued: g.rescued,
      gateOpen: g.gateOpen ? 1 : 0,
      won: g.won ? 1 : 0,
      kills: g.kills,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    console.warn('セーブに失敗しました', e);
    return false;
  }
}

function loadSaveData() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || d.v !== 2) return null;      // 古い形式は読まない
    return d;
  } catch { return null; }
}

function applySave(g, d) {
  const p = g.player;
  p.hp = d.hp; p.maxHp = d.maxHp;
  p.coins = d.coins; p.keys = d.keys; p.gems = d.gems || 0;
  p.bombs = d.bombs; p.potions = d.potions;
  p.swordLv = d.swordLv; p.magic = d.magic || 0;
  p.mp = d.mp || 0; p.maxMp = d.maxMp || 0;
  p.item = d.item || 'bomb';
  p.relics = d.relics || 0;
  g.playTime = d.time || 0;
  g.rescued = d.rescued || 0;
  g.gateOpen = !!d.gateOpen;
  g.won = !!d.won;
  g.kills = d.kills || 0;
  const w = g.world;
  (d.buildings || []).forEach((v, i) => { if (w.buildings[i]) w.buildings[i].built = !!v; });
  (d.villagers || []).forEach((v, i) => { if (w.villagers[i]) w.villagers[i].freed = !!v; });

        py = (gw.y + 0.5 - dy * 2.0) * TILE;
      } else if (px == null || py == null) {
        px = built.center.x; py = built.center.y + 24;
      }
      g.pendingRoom = null;

      // 敵は 島に入るたびに わいてくる
      for (const m of built.mobs) g.spawnEnemy(m.x * TILE + 8, m.y * TILE + 8, m.kind, m.level);

      // 済んだものを反映
      const v = g.world.villagers.find(vv => vv.roomId === rid);
      if (v && v.freed && built.spots.cage) built.level.setO(built.spots.cage.x, built.spots.cage.y, O.NONE);
      if (built.spots.chest && g.openedChests.has(`${rid}:${built.spots.chest.x},${built.spots.chest.y}`))
        built.level.setO(built.spots.chest.x, built.spots.chest.y, O.CHEST_OPEN);
      if (built.spots.gate && g.gateOpen) built.level.setO(built.spots.gate.x, built.spots.gate.y, O.NONE);

      spawnRoomNpcs(room, built);
    } else if (id.endsWith(ARENA_SUFFIX)) {
      // --- ボスの舞台 ---
      const dgId = id.slice(0, -ARENA_SUFFIX.length);
      const def = g.world.dungeons.find(d => d.id === dgId);
      let ar = g.arenas[id];
      if (!ar) {
        ar = generateArena({ id, name: def.name + ' ‧ 最奥', seed: def.seed, theme: def.theme });
        ar.level.setO(ar.spawn.x, ar.spawn.y + 1, O.EXIT);
        g.arenas[id] = ar;
      }
      g.level = ar.level;
      g.levelId = id;
      g.arenaSeed = def.seed;
      if (!def.cleared) {
        g.boss = new GiantBoss(g, BOSS_OF[dgId] || 'grinner', def.level);
        playMusic('boss');
        UIx.hint('すばやく 指を はらうと ころがって よけられます。\n地面に降りた「手」だけが 斬れます。', 9);
      } else if (!def.relicTaken) {
        // 倒したのに 取り忘れていた遺物は、ちゃんと待っている
        g.level.setO(ar.relicPos.x, ar.relicPos.y, O.RELIC);
      }
      px = px ?? ar.spawn.x * TILE + 8;
      py = py ?? ar.spawn.y * TILE + 8;
    } else {
      let dg = g.dungeons[id];
      const def = g.world.dungeons.find(d => d.id === id);
      if (!dg) {
        dg = generateDungeon(def, 1);
        g.dungeons[id] = dg;
        if (def.cleared) {
          // クリア済みなら扉を開けておく
          if (dg.doorPos) for (const [ox, oy] of [[0, 0], [1, 0], [0, 1], [1, 1]])
            if (dg.level.o(dg.doorPos.x + ox, dg.doorPos.y + oy) === O.DOOR)
              dg.level.setO(dg.doorPos.x + ox, dg.doorPos.y + oy, O.NONE);
        }
      }
      g.level = dg.level;
      g.levelId = id;
      // 敵を配置（クリア後も再湧きする）
      for (const e of dg.enemies) g.spawnEnemy(e.x * TILE + 8, e.y * TILE + 8, e.kind, e.level);
      // 開けた宝箱を反映
      for (const c of dg.chests) if (g.openedChests.has(`${id}:${c.x},${c.y}`)) g.level.setO(c.x, c.y, O.CHEST_OPEN);
      px = px ?? dg.spawn.x * TILE + 8;
      py = py ?? dg.spawn.y * TILE + 8;
    }
    g.player.x = px; g.player.y = py;
    g.player.kbx = g.player.kby = 0;
    g.player.spawnGuard = 0.6;
    R.snapCamera(g.player, g.level);
    g.level.markExplored(g.player.tx, g.player.ty, g.level.dark ? 5 : 9);
    UIx.invalidateMap();
    playMusic(g.level.kind === 'arena' ? 'boss' : g.level.kind === 'dungeon' ? 'dungeon' : nearTown() ? 'town' : 'field');
    clearHeld();
  };
  if (!fade) { doIt(); return; }
  g.transition = { t: 0, dur: 0.62, half: false, action: doIt };
  sfx('door');
}

/** その島に立っている人たち */
function spawnRoomNpcs(room, built) {
  g.hatman = null;
  // 建物の前の店主
  let i = 0;
  for (const b of (built.buildings || [])) {
    if (!b.built || b.id === 'home') continue;
    g.npcs.push(new Npc(b.x * TILE + b.w * TILE / 2, (b.y + b.h) * TILE + 10, i + 2, {
      name: b.name, lines: Story.SHOP_TALK[b.id] || ['ようこそ。'],
    }));
    i++;
  }
  // 町には 助けた村人が うろついている
  if (room.kind === 'town') {
    const n = Math.min(g.rescued, 6);
    const cx = built.w * TILE / 2, cy = built.h * TILE / 2;
    for (let k = 0; k < n; k++) {
      const a = (k / Math.max(1, n)) * Math.PI * 2;
      g.npcs.push(new Npc(cx + Math.cos(a) * (30 + k * 5), cy + 34 + Math.sin(a) * (22 + k * 3), k,
        { name: '村人', lines: [Story.VILLAGER_IDLE[k % Story.VILLAGER_IDLE.length]] }));
    }
  }
  // 帽子の人
  if (room.id === hatmanRoomId()) {
    const hat = new Npc(built.center.x + 18, built.center.y - 26, 0, {
      name: '帽子の人', spr: 'hatman', static: true, bob: true, hatman: true, lines: [],
    });
    hat.data.hatman = true;
    g.npcs.push(hat);
    g.hatman = hat;
  }
}

/** 帽子の人は 進み具合で 立つ島が変わる */
function hatmanRoomId() {
  const list = g.world.hatmanRooms;
  if (!list || !list.length) return null;
  const cleared = g.world.dungeons.filter(d => d.cleared).length;
  const stage = g.won ? list.length - 1 : Math.min(list.length - 1, (g.player.relics >= 3 ? 3 : cleared));
  return list[stage];
}

function nearTown() {
  const r = currentRoom();
  return !!r && (r.kind === 'town' || r.kind === 'home');
}

// ---------------------------------------------------------------------------
// メインループ
// ---------------------------------------------------------------------------
let last = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const t = now / 1000;
  let dt = Math.min(0.05, t - last || 0.016);
  last = t;
  if (dt <= 0) dt = 0.016;

  updateInput(dt);
  R.setTime(t);

  switch (g.state) {
    case 'title': updateTitle(dt, t); break;
    case 'play': updatePlay(dt); break;
    case 'gameover': updateGameOver(dt); break;
    case 'ending': updateEnding(dt); break;
  }
  endInputFrame();
}

// ---------------------------------------------------------------------------
// タイトル
// ---------------------------------------------------------------------------
function updateTitle(dt, t) {
  g.stateT += dt;
  input.stickEnabled = false;
  const canCont = saveExists;
  setButtons(UIx.titleButtons(canCont));
  const pressed = pressedButtons();
  if (pressed.has('title0') || (input.aPressed && !canCont)) {
    startAudio();
    sfx('levelup');
    if (canCont) continueGame(); else newGame((Math.random() * 1e9) | 0);
  } else if (pressed.has('title1')) {
    startAudio();
    sfx('ui');
    deleteSave();
    newGame((Math.random() * 1e9) | 0);
  } else if (input.taps.length && !canCont) {
    startAudio(); sfx('levelup'); newGame((Math.random() * 1e9) | 0);
  }

  const sctx = R.getCtx().sctx;
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.fillStyle = '#08070c';
  sctx.fillRect(0, 0, sctx.canvas.width, sctx.canvas.height);
  R.beginUi();
  UIx.drawTitle(sctx, g, t, canCont);
  R.endUi();
}

let audioStarted = false;
function startAudio() {
  if (audioStarted) return;
  audioStarted = true;
  initAudio();
  playMusic('town');
}

// このフレームに押されたボタン ID（pointerdown 時点で確定）
function pressedButtons() { return input.pressedIds; }

// ---------------------------------------------------------------------------
// プレイ
// ---------------------------------------------------------------------------
function updatePlay(dt) {
  const p = g.player;
  // 力尽きたら 開いている UI は畳む（会話中に止まったままにならないように）
  if (p.hp <= 0) {
    if (UIx.dialog.active) { UIx.dialog.active = false; UIx.dialog.onDone = null; }
    if (UIx.menu.active) { UIx.menu.active = false; UIx.menu.onClose = null; }
    g.mapOpen = false;
  }
  const uiBusy = UIx.dialog.active || UIx.menu.active || g.mapOpen;
  input.stickEnabled = !uiBusy && !g.transition;
  g.canAct = !uiBusy && !g.transition && p.hp > 0;

  if (!uiBusy) g.playTime += dt;
  g.autoSaveT += dt;

  // --- 画面遷移 ---
  if (g.transition) {
    g.transition.t += dt;
    if (!g.transition.half && g.transition.t >= g.transition.dur / 2) {
      g.transition.half = true;
      g.transition.action();
    }
    if (g.transition.t >= g.transition.dur) g.transition = null;
  }

  // --- ボタン登録 ---
  const btns = [];
  if (g.mapOpen) {
    // 全面タップで閉じる
  } else if (UIx.menu.active) {
    btns.push(...UIx.registerMenuButtons());
  } else if (UIx.dialog.active) {
    const d = UIx.registerDialogButtons();
    if (d) btns.push(...d);
  } else {
    const L = UIx.controlLayout();
    if (UIx.ui.showControls) {
      const order = ['bomb', 'potion'];
      if (g.player.magic) order.push('magic');
      if (order.length > 1) btns.push({ id: 'swap', x: L.swap.x, y: L.swap.y, r: L.swap.r });
      btns.push({ id: 'b', x: L.b.x, y: L.b.y, r: L.b.r });
      btns.push({ id: 'a', x: L.a.x, y: L.a.y, r: L.a.r });
    }
    const hb = UIx.hudButtonLayout();
    btns.push({ id: 'menu', x: hb.menu.x, y: hb.menu.y, r: hb.menu.r });
    btns.push({ id: 'map', x: hb.map.x, y: hb.map.y, r: hb.map.r });
  }
  setButtons(btns);
  const pressed = pressedButtons();

  // --- UI 状態の処理 ---
  if (g.mapOpen) {
    if (input.taps.length || input.menuPressed || input.mapPressed || input.aPressed) {
      g.mapOpen = false; sfx('uiBack'); clearHeld();
    }
  } else if (UIx.menu.active) {
    handleMenuInput(pressed);
  } else if (UIx.dialog.active) {
    if (UIx.dialog.choices) {
      for (let i = 0; i < UIx.dialog.choices.length; i++) {
        if (pressed.has('dlg' + i)) {
          sfx('ui');
          const cb = UIx.dialog.onChoice;
          UIx.dialog.active = false;
          UIx.dialog.onDone = null;
          if (cb) cb(i);
          break;
        }
      }
    }
    UIx.updateDialog(dt);
  } else {
    if (pressed.has('menu') || input.menuPressed) { openPauseMenu(); }
    else if (pressed.has('map') || input.mapPressed) { g.mapOpen = true; UIx.invalidateMap(); sfx('ui'); clearHeld(); }
    else if (pressed.has('swap')) { cycleItem(); sfx('ui'); }
  }

  // --- ゲーム進行 ---
  if (g.canAct || (!uiBusy && p.hp <= 0)) {
    FX.updateFx(dt);
    const step = FX.fx.hitstop > 0 ? 0 : dt;
    if (step > 0) simulate(step);
  } else {
    FX.updateFx(dt * 0.4);
  }

  updateBubbles(dt);
  UIx.updateHint(dt);

  // 自動セーブ
  if (g.autoSaveT > 20 && g.levelId === 'field' && !uiBusy) {
    g.autoSaveT = 0;
    saveGame(g);
  }

  R.updateCamera(dt, p, g.level);
  R.drawScene(g);

  // --- UI 描画 ---
  const { sctx } = R.getCtx();
  R.present();
  R.beginUi();

  if (g.mapOpen) {
    UIx.drawMap(sctx, g);
  } else {
    drawBubbles(sctx, (wx, wy) => ({ x: (wx - g.camx) * R.view.scale, y: (wy - g.camy) * R.view.scale }), UIx.ui.S);
    UIx.drawHud(sctx, g);
    if (!UIx.menu.active && !UIx.dialog.active) UIx.drawTouchControls(sctx, g);
    UIx.drawDialog(sctx);
    UIx.drawMenu(sctx);
    drawInteractPrompt(sctx);
  }
  if (g.transition) {
    const t = g.transition.t / g.transition.dur;
    const a = t < 0.5 ? t * 2 : (1 - t) * 2;
    sctx.fillStyle = `rgba(6,4,10,${clamp(a, 0, 1)})`;
    sctx.fillRect(0, 0, R.view.cssW, R.view.cssH);
  }
  R.endUi();

  if (UIx.ui.toastT > 0) UIx.ui.toastT -= dt;
}

// ---------------------------------------------------------------------------
function simulate(dt) {
  const p = g.player;

  // --- 攻撃・ため・道具の入力（ここが唯一の入口）---
  if (g.canAct) {
    const target = findInteract();
    g.interact = target;
    const idle = p.attack <= 0 && p.spin <= 0;

    // 軽いタップ／Ａ押下：目の前に調べられる物があればそちら優先
    if (input.aPressed || input.gTap) {
      if (target) doInteract(target);
      else if (idle && p.cooldown <= 0) p.startAttack(false);
    }
    // 片手ジェスチャで ためきって離した
    if (input.gCharge && idle) p.startAttack(true);

    // Ａボタン長押しの「ため」（振り終わってから貯まりはじめる）
    // ※ 離した瞬間の判定を先に見ること。あとだと charge が 0 に戻ってしまう。
    const canSpin = p.attack <= 0 && p.spin <= 0;
    if (input.aReleased) {
      if (p.charge > PLAYER.chargeTime && canSpin) p.startAttack(true);
      p.charge = 0;
    } else if (input.a && canSpin) {
      const before = p.charge;
      p.charge += dt;
      if (before <= PLAYER.chargeTime && p.charge > PLAYER.chargeTime) sfx('magic');
    } else if (!input.a && !input.gStill) {
      p.charge = 0;
    }
    // 片手ジェスチャ中は溜めゲージをキャラにも反映（きらめき表示用）
    if (input.gStill && input.gHeld > 0 && canSpin) p.charge = input.gHeld;

    // 払い（スワイプ）または回避キーで ローリング
    if (input.swiped) {
      let dx = input.swipeX, dy = input.swipeY;
      if (Math.hypot(dx, dy) < 0.1) { const v = DIR_VEC[p.dir]; dx = v[0]; dy = v[1]; }
      p.startRoll(dx, dy);
    }

    if (input.bPressed) useItem();
  } else { g.interact = null; p.charge = 0; }

  p.update(dt, g);

  // --- 攻撃判定 ---
  resolveAttack();

  // --- エンティティ ---
  for (const e of g.enemies) if (!e.dead) e.update(dt, g);
  for (let i = g.enemies.length - 1; i >= 0; i--) {
    if (g.enemies[i].dead) { g.kills++; g.enemies.splice(i, 1); }
  }
  for (const e of g.pickups) e.update(dt, g);
  for (let i = g.pickups.length - 1; i >= 0; i--) if (g.pickups[i].dead) g.pickups.splice(i, 1);
  for (const e of g.projectiles) e.update(dt, g);
  for (let i = g.projectiles.length - 1; i >= 0; i--) if (g.projectiles[i].dead) g.projectiles.splice(i, 1);
  for (const e of g.bombs) e.update(dt, g);
  for (let i = g.bombs.length - 1; i >= 0; i--) if (g.bombs[i].dead) g.bombs.splice(i, 1);
  for (const e of g.npcs) e.update(dt, g);

  // --- ボスと、地面に降る危険 ---
  if (g.boss) g.boss.update(dt, g);
  updateHazards(dt, g);

  // --- 探索マーク ---
  g.level.markExplored(p.tx, p.ty, g.level.dark ? 4 : 8);

  // --- 遺物・出口など踏むと発生するもの ---
  checkTileTriggers();

  // --- 死亡 ---
  if (p.hp <= 0 && g.state === 'play' && p.deadT > 1.0) {
    g.state = 'gameover'; g.stateT = 0;
    stopMusic();
  }

  // --- BGM 切り替え ---
  if (g.levelId.startsWith('room:')) playMusic(nearTown() ? 'town' : 'field');
}

// ---------------------------------------------------------------------------
function resolveAttack() {
  const p = g.player;
  const hb = p.hitbox();
  if (!hb) return;
  const dmg = p.dmg * (hb.spin ? 2 : 1);
  for (const e of g.enemies) {
    if (e.dead || e.hp <= 0 || p.attackHit.has(e)) continue;
    if (Math.abs(e.x - hb.x) < hb.hw + e.hw && Math.abs(e.y - 4 - hb.y) < hb.hh + e.hh + 6) {
      p.attackHit.add(e);
      e.hurt(g, dmg, p.x, p.y, hb.spin ? 190 : PLAYER.knockback);
    }
  }
  // 壊せるオブジェクト
  const x0 = Math.floor((hb.x - hb.hw) / TILE), x1 = Math.floor((hb.x + hb.hw) / TILE);
  const y0 = Math.floor((hb.y - hb.hh) / TILE), y1 = Math.floor((hb.y + hb.hh) / TILE);
  for (let y = y0; y <= y1; y++)
    for (let x = x0; x <= x1; x++) {
      const key = 'o' + x + ',' + y;
      if (p.attackHit.has(key)) continue;
      const id = g.level.o(x, y);
      const def = OBJ_DEF[id];
      if (!def || def.hp <= 0) continue;
      p.attackHit.add(key);
      damageObject(x, y, hb.spin ? 3 : 1);
    }
}

function damageObject(x, y, amount) {
  const lv = g.level;
  const id = lv.o(x, y);
  const def = OBJ_DEF[id];
  if (!def || def.hp <= 0) return;
  const i = lv.idx(x, y);
  const hp = (lv.objHp.get(i) ?? def.hp) - amount;
  const cx = x * TILE + 8, cy = y * TILE + 10;
  if (hp > 0) {
    lv.objHp.set(i, hp);
    FX.burst(cx, cy, 4, id === O.BUSH ? [PAL.a, PAL['9']] : [PAL.e, PAL.f]);
    sfx('hit');
    return;
  }
  lv.setO(x, y, O.NONE);
  sfx(id === O.CAGE ? 'chest' : 'hit');
  FX.burst(cx, cy, 10, id === O.BUSH ? [PAL.a, PAL['9'], PAL.b] : id === O.CAGE ? [PAL.u, PAL.c] : [PAL.e, PAL.f, PAL.d]);
  FX.shake(1.5, 0.12);
  const rng = Math.random();
  if (id === O.BUSH || id === O.POT) {
    if (rng < 0.24) g.spawnPickup(cx, cy, 'coin');
    else if (rng < 0.32) g.spawnPickup(cx, cy, 'heart');
    else if (rng < 0.35) g.spawnPickup(cx, cy, 'bomb');
  } else if (id === O.CAGE) {
    freeVillager(x, y);
  } else if (id === O.CRYSTAL) {
    for (let k = 0; k < 4; k++) g.spawnPickup(cx, cy, 'coin');
  }
}

function freeVillager(x, y) {
  const v = g.world.villagers.find(v => v.roomId === g.roomId);
  if (!v || v.freed) return;
  v.freed = true;
  g.rescued++;
  sfx('rescue');
  duckMusic();
  FX.ring(x * TILE + 8, y * TILE + 8, { r0: 4, r1: 40, life: 0.5, color: PAL.t, width: 2 });
  FX.burst(x * TILE + 8, y * TILE + 8, 22, [PAL.t, PAL.s, PAL.C], { spMax: 110, life: 0.9 });
  const b = BUILDINGS.find(bb => bb.id === v.building);
  const npc = new Npc(x * TILE + 8, y * TILE + 18, v.kind, { static: true, name: '村人' });
  g.npcs.push(npc);
  const rl = Story.RESCUE_LINES[g.rescued % Story.RESCUE_LINES.length];
  UIx.openDialog({
    speaker: '村人',
    portrait: v.kind % SPR.villagers.length,
    text: [rl[0], `${rl[1]}\n${b ? `（村に「${b.name}」が 建てられる）` : ''}`],
    onDone: () => {
      const i = g.npcs.indexOf(npc);
      if (i >= 0) g.npcs.splice(i, 1);
      FX.burst(npc.x, npc.y - 6, 14, [PAL.t, PAL.C]);
      UIx.toast(`村人を ${g.rescued} 人 すくった`, b ? `村で「${b.name}」を 建てられる` : '');
      saveGame(g);
      UIx.invalidateMap();
    },
  });
}

// ---------------------------------------------------------------------------
// 触れるもの
// ---------------------------------------------------------------------------
function findInteract() {
  const p = g.player;
  // NPC
  let best = null, bestD = 26;
  for (const n of g.npcs) {
    const d = dist(n.x, n.y, p.x, p.y);
    if (d < bestD) { bestD = d; best = { type: 'npc', npc: n, x: n.x, y: n.y - 18 }; }
  }
  if (best) return best;

  // 建物の入口
  if (g.levelId === 'field') {
    for (const b of g.level.buildings) {
      const cx = (b.x + b.w / 2) * TILE, cy = (b.y + b.h) * TILE;
      if (Math.abs(p.x - cx) < 20 && p.y > cy - 12 && p.y < cy + 20) {
        return { type: 'building', b, x: cx, y: cy - 22 };
      }
    }
  }

  // 目の前・足元のタイル
  const [dx, dy] = DIR_VEC[p.dir];
  const cands = [
    [Math.floor((p.x + dx * 12) / TILE), Math.floor((p.y + dy * 12) / TILE)],
    [p.tx, p.ty],
    [Math.floor((p.x + dx * 12) / TILE), Math.floor((p.y - 6 + dy * 12) / TILE)],
  ];
  for (const [x, y] of cands) {
    const id = g.level.o(x, y);
    if (id === O.CHEST) return { type: 'chest', x: x * TILE + 8, y: y * TILE - 4, tx: x, ty: y };
    if (id === O.SIGN) return { type: 'sign', x: x * TILE + 8, y: y * TILE - 4, tx: x, ty: y };
    if (id === O.CAVE) return { type: 'cave', x: x * TILE + 8, y: y * TILE - 4, tx: x, ty: y };
    if (id === O.DOOR) return { type: 'door', x: x * TILE + 8, y: y * TILE - 4, tx: x, ty: y };
    if (id === O.GATE) return { type: 'gate', x: x * TILE + 8, y: y * TILE - 4, tx: x, ty: y };
    if (id === O.EXIT) return { type: 'exit', x: x * TILE + 8, y: y * TILE - 4, tx: x, ty: y };
    if (id === O.PORTAL) return { type: 'portal', x: x * TILE + 8, y: y * TILE - 6, tx: x, ty: y };
    if (id === O.VENDING) return { type: 'vending', x: x * TILE + 8, y: y * TILE - 6, tx: x, ty: y };
    if (id === O.SHRINE) return { type: 'shrine', x: x * TILE + 8, y: y * TILE - 4, tx: x, ty: y };
    if (id === O.RELIC) return { type: 'relic', x: x * TILE + 8, y: y * TILE - 4, tx: x, ty: y };
  }
  return null;
}

function doInteract(t) {
  const p = g.player;
  switch (t.type) {
    case 'npc': {
      const n = t.npc;
      if (n.data.hatman) {
        sayQueue(n, Story.hatmanLines(g), { tone: 'boss', per: 3.2 });
        sfx('ui');
        return;
      }
      const b = g.level.buildings.find(bb => bb.built && bb.name === n.name);
      if (b) { openBuildingMenu(b); return; }
      sayQueue(n, n.lines, { per: 3.0 });
      sfx('ui');
      break;
    }
    case 'building': openBuildingMenu(t.b); break;
    case 'sign': {
      const room = currentRoom();
      const idx = room && room.content.sign != null ? room.content.sign : 0;
      sayQueue({ x: t.x, y: t.y + 6, dead: false },
        [Story.SIGNS[idx % Story.SIGNS.length]], { per: 3.6 });
      sfx('ui');
      break;
    }
    case 'chest': openChest(t.tx, t.ty); break;
    case 'vending': useVending(t); break;
    case 'shrine': useShrine(t); break;
    case 'cave': {
      const d = g.world.dungeons.find(d => d.roomId === g.roomId);
      if (!d) return;
      UIx.toast(d.name, d.cleared ? 'クリア済み' : 'なかへ 入る');
      g.returnRoomId = g.roomId;
      g.returnPos = { x: t.tx * TILE + 8, y: (t.ty + 1) * TILE + 12 };
      enterLevel(d.id, null, null, true);
      break;
    }
    case 'exit': enterRoom(g.returnRoomId || g.world.startId, null, true, g.returnPos); break;
    case 'portal': {
      const dgId = g.levelId;
      const def = g.world.dungeons.find(d => d.id === dgId);
      if (!def) return;
      if (def.cleared) {
        UIx.openDialog({ speaker: '門', text: ['むこう側は もう しずかだ。'] });
        return;
      }
      UIx.openDialog({
        speaker: '古い門',
        text: ['むこうから 息づかいが きこえる。', '入るか？'],
        choices: ['入る', 'やめる'],
        onChoice: (i) => {
          if (i !== 0) return;
          g.returnPos = { x: g.player.x, y: g.player.y + 20 };
          g.dungeonReturn = dgId;
          enterLevel(dgId + ARENA_SUFFIX, null, null, true);
        },
      });
      break;
    }
    case 'door': {
      if (p.keys > 0) {
        p.keys--;
        sfx('door'); duckMusic(0.1, 0.8);
        const dg = g.dungeons[g.levelId];
        if (dg && dg.doorPos) {
          for (const [ox, oy] of [[0, 0], [1, 0], [0, 1], [1, 1]])
            if (g.level.o(dg.doorPos.x + ox, dg.doorPos.y + oy) === O.DOOR)
              g.level.setO(dg.doorPos.x + ox, dg.doorPos.y + oy, O.NONE);
        } else g.level.setO(t.tx, t.ty, O.NONE);
        FX.burst(t.x, t.y + 8, 14, [PAL.f, PAL.d, PAL.s]);
        UIx.toast('カギを つかった');
      } else {
        sfx('error');
        UIx.openDialog({ text: ['かたく とじている。\nカギが 必要だ。'] });
      }
      break;
    }
    case 'gate': {
      if (p.relics >= 3) {
        g.gateOpen = true;
        g.level.setO(t.tx, t.ty, O.NONE);
        sfx('relic'); FX.flash('#ffffff', 0.9); FX.shake(6, 0.6);
        UIx.openDialog({
          speaker: '古い門', text: ['三つの 遺物が 光を とりもどした。', '門が、ひらく——'],
          onDone: () => { g.won = true; saveGame(g); g.state = 'ending'; g.stateT = 0; stopMusic(); },
        });
      } else {
        sfx('error');
        UIx.openDialog({ speaker: '古い門', text: [`三つの 遺物が いる。\nいま ${p.relics} / 3。`] });
      }
      break;
    }
    case 'relic': {
      g.level.setO(t.tx, t.ty, O.NONE);
      p.relics++;
      if (g.levelId.endsWith(ARENA_SUFFIX)) {
        const d = g.world.dungeons.find(dd => dd.id === g.levelId.replace(ARENA_SUFFIX, ''));
        if (d) d.relicTaken = true;
      }
      sfx('relic'); FX.flash('#ffffff', 0.8);
      FX.ring(t.x, t.y + 8, { r0: 4, r1: 50, life: 0.6, color: PAL.t, width: 2 });
      saveGame(g);
      const inArena = g.levelId.endsWith(ARENA_SUFFIX);
      UIx.openDialog({
        speaker: '遺物', text: [`遺物を てにいれた。 (${p.relics}/3)`,
          p.relics >= 3 ? '三つ そろった。\n東の「古い門」へ。' : 'まだ 光が たりない。'],
        onDone: () => { if (inArena) enterRoom(g.returnRoomId || g.world.startId, null, true, g.returnPos); },
      });
      break;
    }
  }
}

const DIRS8 = ['きた', 'きたひがし', 'ひがし', 'みなみひがし', 'みなみ', 'みなみにし', 'にし', 'きたにし'];

/** 祠：いちばん近い用事の方角を おしえてくれる */
function useShrine(t) {
  const w = g.world;
  const p = g.player;
  const here = currentRoom();
  const targets = [];
  for (const v of w.villagers) if (!v.freed) targets.push({ roomId: v.roomId, what: 'とらわれた だれか' });
  for (const d of w.dungeons) if (!d.cleared) targets.push({ roomId: d.roomId, what: d.name });
  if (p.relics >= 3) targets.push({ roomId: w.gateRoomId, what: '古い門' });

  let best = null, bd = Infinity;
  for (const tg of targets) {
    const r = w.rooms.get(tg.roomId);
    if (!r) continue;
    const d = Math.abs(r.gx - here.gx) + Math.abs(r.gy - here.gy);
    if (d < bd) { bd = d; best = { ...tg, gx: r.gx, gy: r.gy, name: r.name }; }
  }
  sfx('magic');
  if (!best) {
    sayQueue({ x: t.x, y: t.y + 4, dead: false }, ['もう、さがすものは ないみたい。'], { per: 3 });
    return;
  }
  const a = Math.atan2(best.gy - here.gy, best.gx - here.gx);
  const idx = Math.round(((a + Math.PI / 2) / (Math.PI * 2)) * 8 + 8) % 8;
  const far = bd <= 1 ? 'すぐ となり' : bd <= 3 ? `島を ${bd} つ ぶん` : `ずいぶん 遠い（島 ${bd} つ）`;
  // 行き先を マップに うつす
  const tr = w.rooms.get(best.roomId);
  if (tr) tr.known = true;
  UIx.invalidateMap();
  sayQueue({ x: t.x, y: t.y + 4, dead: false },
    [`${DIRS8[idx]} の ほうに\n「${best.what}」が ある。`, `${far}。\n気をつけて。`], { per: 3.2 });
}

/** 自販機：15 コインで なにか出る（出ないこともある）*/
function useVending(t) {
  const p = g.player;
  if (p.coins < 15) {
    sfx('error');
    UIx.openDialog({ speaker: '自販機', text: ['コインが たりない。\n（15 コイン）'] });
    return;
  }
  UIx.openMenu({
    title: '自販機',
    sub: 'なにが出るかは 運しだい（15 コイン）',
    items: [
      {
        label: 'ボタンを おす', sub: `所持 ${p.coins} コイン`, cost: 15,
        action: () => {
          p.coins -= 15;
          const r = Math.random();
          FX.burst(t.x, t.y + 14, 8, [PAL.A, PAL.C, PAL.s]);
          if (r < 0.30) { p.potions++; sfx('buy'); UIx.toast(Story.VENDING_HIT[0]); }
          else if (r < 0.55) { p.bombs += 2; sfx('buy'); UIx.toast(Story.VENDING_HIT[1]); }
          else if (r < 0.72) { p.coins += 32; sfx('coin'); UIx.toast(Story.VENDING_HIT[2]); }
          else if (r < 0.82) { p.heal(4); sfx('heart'); UIx.toast(Story.VENDING_HIT[3]); }
          else {
            sfx('error');
            UIx.toast(Story.VENDING_MISS[(Math.random() * Story.VENDING_MISS.length) | 0]);
          }
          saveGame(g);
        },
      },
      { label: 'やめる', action: () => {} },
    ],
  });
}

function openChest(x, y) {
  const key = `${g.levelId}:${x},${y}`;
  if (g.openedChests.has(key)) return;
  g.openedChests.add(key);
  g.level.setO(x, y, O.CHEST_OPEN);
  sfx('chest');
  FX.ring(x * TILE + 8, y * TILE + 6, { r0: 3, r1: 24, life: 0.4, color: PAL.t });
  FX.burst(x * TILE + 8, y * TILE + 4, 12, [PAL.t, PAL.s], { spMax: 70 });

  let loot = 'coins';
  if (g.levelId.startsWith('room:')) {
    const room = currentRoom();
    const h = ((room.seed % 100) / 100);
    loot = h < 0.22 ? 'heart' : h < 0.5 ? 'coins' : h < 0.72 ? 'bomb' : h < 0.88 ? 'potion' : 'key';
  } else {
    const src = g.dungeons[g.levelId]?.chests || [];
    const c = src.find(c => c.x === x && c.y === y);
    loot = c ? c.loot : 'coins';
  }
  const p = g.player;
  let msg = '';
  if (loot === 'key') { p.keys++; msg = 'カギ を てにいれた！'; }
  else if (loot === 'heart') { p.maxHp += 2; p.hp = p.maxHp; msg = 'ハートの器！ 最大 HP が ふえた'; sfx('levelup'); }
  else if (loot === 'bomb') { p.bombs += 3; msg = '爆弾 ×3'; }
  else if (loot === 'potion') { p.potions += 1; msg = 'ポーション ×1'; }
  else {
    const n = 18 + ((Math.random() * 30) | 0);
    const drops = 8, per = Math.ceil(n / drops);
    for (let i = 0; i < drops; i++) g.spawnPickup(x * TILE + 8, y * TILE + 8, 'coin', per);
    msg = `コイン ×${n}`;
  }
  UIx.toast(msg);
  saveGame(g);
}

function checkTileTriggers() {
  const p = g.player;
  const id = g.level.o(p.tx, p.ty);
  if (id === O.RELIC) {
    doInteract({ type: 'relic', tx: p.tx, ty: p.ty, x: p.tx * TILE + 8, y: p.ty * TILE });
    return;
  }
  // 島のはしの小道に立つと となりへ
  if (id === O.GATEWAY && g.levelId.startsWith('room:') && !g.transition) {
    const built = g.rooms[g.roomId];
    if (!built) return;
    for (const d of ['n', 's', 'e', 'w']) {
      const gw = built.gateways[d];
      if (gw && gw.x === p.tx && gw.y === p.ty) { travel(d); return; }
    }
  }
}

function useItem() {
  const p = g.player;
  if (p.item === 'bomb') {
    if (p.bombs <= 0) { sfx('error'); UIx.toast('爆弾が ない'); return; }
    p.bombs--;
    const [dx, dy] = DIR_VEC[p.dir];
    const b = new Bomb(p.x + dx * 10, p.y + dy * 8, 6 + p.swordLv);
    b.vx = dx * 40; b.vy = dy * 40;
    g.bombs.push(b);
    sfx('fuse');
  } else if (p.item === 'potion') {
    if (p.potions <= 0) { sfx('error'); UIx.toast('ポーションが ない'); return; }
    if (p.hp >= p.maxHp) { sfx('error'); UIx.toast('元気いっぱいだ'); return; }
    p.potions--;
    p.heal(6);
    sfx('heart');
    FX.ring(p.x, p.y - 6, { r0: 3, r1: 22, life: 0.4, color: PAL.p });
  } else if (p.item === 'magic') {
    if (p.mp <= 0) { sfx('error'); UIx.toast('まりょくが たりない'); return; }
    p.mp--;
    const [dx, dy] = DIR_VEC[p.dir];
    const a = Math.atan2(dy, dx);
    g.spawnProjectile(p.x, p.y - 6, a, 130, p.dmg * 2, 'magic', true);
    sfx('magic');
  }
}

function handleMenuInput(pressed) {
  if (pressed.has('menuClose')) { sfx('uiBack'); UIx.closeMenu(); clearHeld(); return; }
  for (let i = 0; i < UIx.menu.items.length; i++) {
    if (pressed.has('menu' + i)) {
      const it = UIx.menu.items[i];
      UIx.menu.idx = i;
      if (it.disabled) { sfx('error'); return; }
      sfx(it.sound || 'ui');
      const act = it.action;
      if (it.close !== false) UIx.menu.active = false;
      if (act) act();
      clearHeld();
      return;
    }
  }
  if (input.menuPressed && UIx.menu.closable) { sfx('uiBack'); UIx.closeMenu(); return; }
  if (UIx.menu.closable && input.taps.length && pressed.size === 0) { sfx('uiBack'); UIx.closeMenu(); }
}

function cycleItem() {
  const p = g.player;
  const order = ['bomb', 'potion'];
  if (p.magic) order.push('magic');
  const i = order.indexOf(p.item);
  p.item = order[(i + 1) % order.length];
  UIx.toast(`どうぐ：${p.item === 'bomb' ? '爆弾' : p.item === 'potion' ? 'ポーション' : '魔法'}`);
}

function openBuildingMenu(b) {
  const p = g.player;
  clearHeld();
  if (!b.built) {
    const v = g.world.villagers.find(v => v.building === b.id);
    const unlocked = !v || v.freed;
    const canPay = p.coins >= b.cost;
    UIx.openMenu({
      title: b.name + '（こうじ中）',
      sub: b.desc,
      items: [
        {
          label: unlocked ? (canPay ? 'ここに 建てる' : 'コインが たりない') : 'まだ 建てられない',
          sub: unlocked ? `所持 ${p.coins} コイン` : 'この店を ひらく 村人を さがそう',
          cost: b.cost,
          disabled: !unlocked || !canPay,
          sound: 'build',
          action: () => {
            p.coins -= b.cost;
            b.built = true;
            applyBuildings(g.level, g.level.buildings || []);
            g.npcs.length = 0; spawnRoomNpcs(currentRoom(), g.rooms[g.roomId]);
            sfx('build');
            FX.shake(3, 0.4);
            FX.burst((b.x + b.w / 2) * TILE, (b.y + b.h) * TILE, 24, [PAL.f, PAL.g, PAL.d], { spMax: 90 });
            UIx.toast(`${b.name} が できた！`, b.desc);
            saveGame(g);
            UIx.invalidateMap();
          },
        },
        { label: 'やめる', action: () => {} },
      ],
    });
    return;
  }
  switch (b.id) {
    case 'home': openHomeMenu(b); break;
    case 'shop': openShopMenu(b); break;
    case 'smith': openSmithMenu(b); break;
    case 'healer': openHealerMenu(b); break;
    case 'sage': openSageMenu(b); break;
    case 'farm': openFarmMenu(b); break;
    case 'well': openWellMenu(b); break;
    default:
      UIx.openDialog({ speaker: b.name, text: [b.desc] });
  }
}

    footer: `所持 ${p.coins} コイン`,
  });
}

function openSageMenu(b) {
  const p = g.player;
  UIx.openMenu({
    title: '賢者の塔',
    sub: p.magic ? `まりょく ${p.mp} / ${p.maxMp}` : 'まだ 魔法を 知らない',
    items: [
      p.magic ? {
        label: 'まりょくを みたす', sub: '30 コイン', cost: 30, disabled: p.coins < 30 || p.mp >= p.maxMp,
        action: () => { p.coins -= 30; p.mp = p.maxMp; sfx('magic'); UIx.toast('まりょくが みちた'); saveGame(g); },
      } : {
        label: '魔法を さずかる', sub: '光の弾を はなてるようになる', icon: 'gem', cost: 150, disabled: p.coins < 150,
        action: () => {
          p.coins -= 150; p.magic = 1; p.maxMp = 8; p.mp = 8; p.item = 'magic';
          sfx('levelup'); FX.flash('#b57ad4', 0.6);
          UIx.toast('魔法を おぼえた！', 'Ｂボタンで 光の弾');
          saveGame(g);
        },
      },
      {
        label: '門について きく', sub: '古い門の うわさ',
        action: () => UIx.openDialog({
          speaker: '賢者',
          text: ['三つの ほら穴の おくに、\n「番人」が 眠っている。',
                 'すべての 遺物を 手にすれば、\n東の 古い門が ひらくだろう。',
                 `いまの 遺物：${p.relics} / 3`],
        }),
      },
      { label: 'やめる', action: () => {} },
    ],
    footer: `所持 ${p.coins} コイン`,
  });
}

function openWellMenu(b) {
  const p = g.player;
  UIx.openMenu({
    title: '井戸',
    sub: 'コインを 投げこむと なにか 起きるとか',
    items: [
      {
        label: 'コインを 投げる', sub: 'なにが 起きるかは 運しだい', cost: 5, disabled: p.coins < 5,
        action: () => {
          p.coins -= 5;
          const r = Math.random();
          FX.ring(p.x, p.y - 6, { r0: 3, r1: 24, life: 0.5, color: PAL.k });
          if (r < 0.34) { p.heal(4); sfx('heart'); UIx.toast('つめたい水で ひといき', '体力が すこし 回復した'); }
          else if (r < 0.60) { p.coins += 20; sfx('coin'); UIx.toast('コインが かえってきた！', '+20 コイン'); }
          else if (r < 0.78) { p.bombs += 2; sfx('buy'); UIx.toast('爆弾が ふたつ 浮いてきた'); }
          else if (r < 0.92) { p.potions += 1; sfx('buy'); UIx.toast('ポーションが 浮いてきた'); }
          else { sfx('error'); UIx.toast('…なにも 起きなかった'); }
          saveGame(g);
        },
      },
      { label: 'のぞきこむ', sub: '', action: () => UIx.openDialog({ speaker: '井戸', text: ['くらい水面に、\n自分の顔が うつっている。'] }) },
      { label: 'やめる', action: () => {} },
    ],
    footer: `所持 ${p.coins} コイン`,
  });
}

function openFarmMenu(b) {
  const p = g.player;
  const ready = (g.playTime - (b.lastHarvest ?? -999)) > 120;
  UIx.openMenu({
    title: '畑',
    sub: ready ? 'きのみが 実っている' : 'まだ 実っていない',
    items: [
      {
        label: 'きのみを とる', sub: ready ? 'ハート3つ 回復＋ポーション' : 'もうすこし 待とう',
        icon: 'heart', disabled: !ready,
        action: () => {
          b.lastHarvest = g.playTime;
          p.heal(6); p.potions++;
          sfx('heart'); UIx.toast('きのみを 食べた', 'ポーションも もらった');
          saveGame(g);
        },
      },
      { label: 'やめる', action: () => {} },
    ],
  });
}

/** いまの目標（マップとメニューに出す） */
g.objectiveText = function () {
  const p = g.player;
  if (!p || !g.world) return '';
  if (g.won) return 'すべて おわった。ありがとう。';
  if (p.relics >= 3) return '東の「古い門」へ 向かおう';
  const left = g.world.dungeons.filter(d => !d.cleared).length;
  if (g.rescued === 0) return 'とらわれた村人を さがそう（檻を 斬る）';
  if (left === 3) return 'ほら穴に もぐって 遺物を さがそう';
  return `遺物を あつめよう（${p.relics} / 3）`;
};

// 自動テスト用の入口（ブラウザからゲーム内部を叩けるようにしておく）
g.ui = UIx;
g.dev = {
  enterLevel: (...a) => enterLevel(...a),
  enterRoom: (...a) => enterRoom(...a),
  travel: (d) => travel(d),
  damageObject: (...a) => damageObject(...a),
  findInteract: () => findInteract(),
  doInteract: (t) => doInteract(t),
  openChest: (...a) => openChest(...a),
  newGame: (s) => newGame(s),
  continueGame: () => continueGame(),
  save: () => saveGame(g),
  openBuildingMenu: (b) => openBuildingMenu(b),
};

// ---------------------------------------------------------------------------
function drawInteractPrompt(ctx) {
  const t = g.interact;
  if (!t || UIx.dialog.active || UIx.menu.active || !g.canAct) return;
  const S = UIx.ui.S;
  const sx = (t.x - g.camx) * R.view.scale;
  const sy = (t.y - g.camy) * R.view.scale;
  const bob = Math.sin(performance.now() / 220) * 3 * S;
  ctx.save();
  ctx.globalAlpha = 0.95;
  ctx.beginPath();
  ctx.arc(sx, sy + bob, 13 * S, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(24,18,30,0.9)'; ctx.fill();
  ctx.strokeStyle = UI.gold; ctx.lineWidth = 2 * S; ctx.stroke();
  UIx.txt(ctx, '！', sx, sy + bob - 9 * S, { size: 16 * S, align: 'center', color: UI.gold, outline: false });
  ctx.restore();
}

// ---------------------------------------------------------------------------
function updateGameOver(dt) {
  g.stateT += dt;
  input.stickEnabled = false;
  FX.updateFx(dt);
  R.drawScene(g);
  R.present();
  const { sctx } = R.getCtx();
  R.beginUi();
  setButtons(UIx.gameOverButtons());
  UIx.drawGameOver(sctx, g, g.stateT);
  R.endUi();

  const pressed = pressedButtons();
  if (g.stateT > 1.2 && (pressed.has('revive') || input.aPressed)) {
    const p = g.player;
    p.coins = Math.floor(p.coins * 0.75);
    p.hp = p.maxHp;
    p.deadT = 0;
    p.invuln = 1.2;
    g.state = 'play'; g.stateT = 0;
    enterRoom(g.world.startId, null, true);
    saveGame(g);
    clearHeld();
  }
}

function updateEnding(dt) {
  g.stateT += dt;
  input.stickEnabled = false;
  const { sctx } = R.getCtx();
  R.drawScene(g);
  R.present();
  R.beginUi();
  UIx.drawEnding(sctx, g, g.stateT);
  R.endUi();
  setButtons([]);
  if (g.stateT > 2.5 && (input.taps.length || input.aPressed)) {
    g.state = 'title'; g.stateT = 0;
    refreshSaveSummary();
    playMusic('town');
    clearHeld();
  }
}

// ---------------------------------------------------------------------------
window.addEventListener('pointerdown', () => { startAudio(); resumeAudio(); }, { once: false });
document.addEventListener('visibilitychange', () => { if (!document.hidden) resumeAudio(); });

boot0();

return { currentRoom };
})();

void __M_main;

})();
